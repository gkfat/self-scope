    mvp: true
    context: [CTX-ACTOR-001, CTX-CON-014, CTX-EXT-006, CTX-EXT-005]
    source: "user 補充（每帳號僅送一次 3 點）"
    note: "贈點紀錄獨立保存並於 3 個月後到期（RULE-031），以伺服器密鑰 HMAC 雜湊儲存、僅用於避免重複贈點；贈點效期 90 天（FR-042）"
  - id: FR-038
    title: 點數扣抵
    description: 系統 SHALL 於會員首次取得某組多維度分析報告 時扣 1 點、生成詳細分析時扣 5 點、下載報告書時每次扣 1 點（重複下載再扣）；餘額不足時 MUST 拒絕並引導購點；扣點與結果交付 MUST 一致；訪客 MUST NOT 可取得多維度分析報告。
    priority: must
    phase: 3
    mvp: true
    context: [CTX-ACTOR-001, CTX-ACTOR-002, CTX-CON-014, CTX-ASM-010]
    source: "user 補充（1 點 summary、5 點詳細分析）"
  - id: FR-039
    title: 點數異動紀錄
    description: 系統 SHALL 記錄每次點數發放、購買、扣除與返還，使用者可查看自己的點數紀錄。
    priority: must
    phase: 3
    mvp: true
    context: [CTX-ACTOR-002, CTX-CON-014]
    source: "user 確認保留（由點數制推導）"
    note: "點數異動紀錄為防重複扣點與對帳所需，使用者可唯讀查看（user 已確認）"
  - id: FR-040
    title: 單項免費結果
    description: 系統 SHALL 允許使用者（含訪客）不扣點取得單項結果：依生日取得星座結果、依血型取得血型分析、完成 MBTI 測驗取得 MBTI 結果；結果皆為固定內容，MUST NOT 呼叫 AI，且 MUST NOT 儲存（每次重新取得）。
    priority: must
    phase: 1
    mvp: true
    context: [CTX-ACTOR-001, CTX-CON-007, CTX-CON-014, CTX-EXT-005, CTX-ASM-010]
    source: "user 補充（沒扣點時可做單一測驗）"
    note: "單項免費結果為固定內容，不儲存、每次重新取得（user 已確認）；MBTI 測驗作答與結果屬測驗結果，登入時儲存 3 個月（FR-005、FR-033）；保存每題作答供 AI 引用依據（FR-005）"
  - id: FR-041
    title: 避免重複扣點
    description: 系統 SHALL 對同一會員已生成過的多維度分析報告 組合直接回傳已存結果且 MUST NOT 再次扣點；重複點擊或並行請求 MUST NOT 造成重複扣點。
    priority: must
    phase: 3
    mvp: true
    context: [CTX-ACTOR-002, CTX-CON-014, CTX-EXT-005]
    source: "user 補充（需避免重複 input 計算以避免讓使用者浪費錢）"
  - id: FR-042
    title: 點數有效期
    description: 系統 SHALL 為點數設定有效期：購買的點數為無限期，贈點有效期 90 天；過期點數 MUST NOT 可用於扣抵；扣抵順序為先到期先扣、無限期批次最後。
    priority: must
    phase: 3
    mvp: true
    context: [CTX-ACTOR-001, CTX-ACTOR-002, CTX-CON-014]
    source: "user 補充（點數需有效期）；user 採納建議（購買點數無限期、贈點 90 天）"
  - id: FR-033
    title: 資料到期刪除
    description: 系統 SHALL 在會員的測驗作答與結果、多維度分析報告、MBTI 欄位與人類圖結果滿 3 個月後、詳細分析滿 6 個月後（各以產生時間點起算）自動刪除；付款紀錄 MUST NOT 因保留期限被刪除。
    priority: must
    phase: 2
    mvp: true
    context: [CTX-CON-012, CTX-CON-006, CTX-EXT-005, CTX-ACTOR-001, CTX-ACTOR-002]
    source: "user 補充（測驗結果、summary、MBTI 3 個月；詳細分析 6 個月）"
    note: "各項保存期限已全部確認"
  - id: FR-035
    title: 資料到期前通知
    description: 系統 SHALL 以 email 在會員的測驗結果、多維度分析報告、人類圖與詳細分析到期前 14 天與 3 天各通知一次；同一使用者同時有多筆到期時合併為一封。
    priority: should
    phase: 5
    mvp: false
    context: [CTX-ACTOR-001, CTX-CON-012, CTX-EXT-007]
    source: "user 補充（到期前會通知，通知系統放後面實作）；user 採納建議"
    note: "延後至 Phase 5"
  - id: FR-043
    title: 付款紀錄保存
    description: 系統 SHALL 在帳號存續期間永久保存付款紀錄，不受測驗結果保留期限影響；使用者刪除帳號時 SHALL 一併移除付款紀錄。
    priority: must
    phase: 4
    mvp: true
    context: [CTX-CON-012, CTX-EXT-001, CTX-ACTOR-004]
    source: "user 補充（付款紀錄永久保存；刪帳號時移除付款紀錄）"
    note: "若目標市場有交易／稅務保存義務，需另行確認"
  - id: FR-034
    title: 詳細分析報告書下載（寄送 email）
    description: 系統 SHALL 讓使用者在報告到期前消耗 1 點，將詳細分析報告書以 PDF 寄送至其 email；若該報告已下載過，系統 MUST 提醒並經使用者確認後才重複扣點與寄送。
    priority: should
    phase: 4
    mvp: false
    context: [CTX-ACTOR-002, CTX-CON-012, CTX-CON-014, CTX-EXT-007]
    source: "user 補充（下載報告書 1 點、PDF、寄送 email、重複下載再扣點並提醒）"
    note: "PDF 以輕量純 JS 庫產生（避免在 Vercel 跑無頭瀏覽器）；寄送失敗重試 2 到 3 次，仍失敗返還 1 點；email 供應商待選；新增套件前先經使用者同意"

nonFunctional:
  - id: NFR-001
    category: security
    title: 外部輸入驗證
    description: 所有外部輸入（request、query、params、body、headers、cookies）MUST 於後端做 runtime 驗證，不得信任前端驗證。
    metric: "所有 API 皆有 schema 驗證；未通過者回傳明確錯誤"
    priority: must
    context: [CTX-CON-003]
    source: "plan §8.1；全域 security 規則"
    note: "計畫書未明述，來自專案全域規範，需確認"
  - id: NFR-002
    category: security
    title: 秘密與金鑰保護
    description: AI API 金鑰、付款密鑰與敏感設定 MUST NOT 出現在前端程式碼，且 MUST 僅由後端保管。
    metric: "前端 bundle 中 0 個秘密金鑰"
    priority: must
    context: [CTX-CON-003, CTX-EXT-001, CTX-EXT-002]
    source: "plan §6.4, §8.1"
  - id: NFR-003
    category: security
    title: 授權與存取控制
    description: 付費功能與報告存取 MUST 由後端授權；使用者僅能存取自己的資料。
    metric: "未授權存取一律被拒絕（需以測試驗證）"
    priority: must
    context: [CTX-CON-003, CTX-ACTOR-002, CTX-EXT-005, CTX-EXT-006]
    source: "plan §8.1"
    note: "Firestore 僅由 Nuxt 伺服器端存取，client 直連一律拒絕（rules 全擋）；API 預設需驗證 ID token，訪客可用端點須明列為公開（CTX-CON-013）"
  - id: NFR-004
    category: security
    title: Webhook 可靠性
    description: 付款 webhook MUST 驗證簽章且重複事件不得造成重複授權或重複記錄。
    metric: "同一事件重送 N 次，最終狀態與送一次相同"
    priority: must
    context: [CTX-EXT-001]
    source: "plan §8.1"
  - id: NFR-005
    category: privacy
    title: 資料最小化與保留
    description: 系統只蒐集功能所需資料，並依保留政策決定測驗答案、輸入快照的保存期限，不無限期保留不必要個資。
    metric: "測驗結果、多維度分析報告、MBTI、人類圖保留 3 個月；詳細分析保留 6 個月；付款紀錄於帳號存續期間永久保存；刪除帳號時移除全部紀錄（贈點紀錄保留 3 個月）；訪客暫存結果 TTL 1 天"
    priority: must
    context: [CTX-CON-006, CTX-CON-012]
    source: "plan §3.1, §7.2, §13.3；user 補充"
  - id: NFR-006
    category: privacy
    title: 日誌敏感資料
    description: 日誌 MUST NOT 寫入不必要的敏感答案或完整個人報告。
    metric: "日誌抽樣檢查 0 筆完整答案/報告內容"
    priority: must
    context: [CTX-CON-006]
    source: "plan §13.3"
  - id: NFR-007
    category: compliance
    title: 結果免責與內容合規
    description: 所有固定與 AI 結果 MUST 標示娛樂/自我探索性質；AI 對心理健康、診斷或危機內容須限制並引導。
    metric: "100% 結果頁含免責說明；固定測試案例中 0 筆診斷式輸出"
    priority: must
    context: [CTX-CON-001, CTX-CON-002]
    source: "plan §1.3, §13.1, §13.2"
  - id: NFR-008
    category: cost
    title: AI 成本控管
    description: 每份報告的 Token、重試與生成次數 MUST 設有上限，並監控每份報告平均成本。
    metric: "未量化，需與相關人確認（單份報告成本上限、Token 上限）"
    priority: must
    context: [CTX-CON-007, CTX-ACTOR-004]
    source: "plan §6.4, §9.4"
    note: "上線前須量測單份 AI 報告成本，作為點數定價依據（FR-011）"
  - id: NFR-009
    category: performance
    title: AI 報告生成時間
    description: AI 報告生成 MUST 設定逾時，並向使用者呈現等待與失敗狀態。
    metric: "單次生成逾時 120 秒（Vercel 函式 maxDuration），逾時視為失敗並返還點數；p95 等待時間待上線量測"
    priority: must
    context: [CTX-EXT-002, CTX-ACTOR-002, CTX-CON-010, CTX-EXT-004]
    source: "plan §6.4, §12；user 補充（Vercel）"
    note: "Vercel 函式（fluid compute）預設 300 秒；Hobby 上限 300 秒，Pro 上限 800 秒（依 Vercel 文件 2026-08）。採非同步生成加輪詢；營運使用 Pro 方案"
  - id: NFR-010
    category: performance
    title: 固定報告查詢效能
    description: 固定報告查詢走 Firebase 以組合鍵直接讀取，不依賴 AI 等其他外部服務。
    metric: "未量化，需與相關人確認（例如 p95 延遲）"
    priority: should
    context: [CTX-CON-004, CTX-CON-007]
    source: "plan §5, §7.1"
    note: "計畫書未給數字，屬推導"
  - id: NFR-011
    category: reliability
    title: AI 供應商故障容忍
    description: AI 或付款服務失敗時，系統 MUST 回報明確錯誤，不得靜默吞掉錯誤，且已付費權限不得因失敗而遺失。
    metric: "未量化，需與相關人確認（可用性目標 SLA）"
    priority: must
    context: [CTX-EXT-001, CTX-EXT-002]
    source: "plan §6.4, §11 Phase 3；全域錯誤處理規則"
  - id: NFR-012
    category: maintainability
    title: 內容與測驗資料驅動
    description: 固定報告與測驗定義 MUST 以資料驅動管理；新測驗 MUST 能沿用既有測驗框架並安全納入 AI 報告。
    metric: "新增一份報告內容或一種測驗無需修改核心程式碼"
    priority: must
    context: [CTX-CON-005, CTX-CON-008, CTX-CON-010]
    source: "plan §11 Phase 2/5, §13.4"
  - id: NFR-013
    category: quality
    title: AI 報告品質驗證
    description: 系統 SHALL 建立固定測試案例，檢查報告是否矛盾、重複、刻板化或過度自信。
    metric: "未量化，需與相關人確認（通過準則）"
    priority: should
    context: [CTX-CON-009, CTX-EXT-002]
    source: "plan §11 Phase 3, §13.2"
    note: "以固定測試案例作為 proposal 的驗收任務（檢查矛盾、重複、刻板化、過度自信），不影響資料模型"
  - id: NFR-014
    category: content-quality
    title: 固定報告文案差異度
    description: 768 份固定報告 SHALL 避免僅替換標籤名稱而內容空泛重複，並經審核流程。
    metric: "未量化，需與相關人確認（重複度門檻、審核通過率）"
    priority: should
    context: [CTX-ACTOR-003, CTX-CON-005]
    source: "plan §13.4"
  - id: NFR-017
    category: reliability
    title: 點數一致性與防重複
    description: 點數的發放、購買入帳與扣除 MUST 為原子且冪等，餘額不得為負；並行請求或重送 MUST NOT 造成重複扣點、重複贈點或超額使用。
    metric: "並行 N 次扣點請求，餘額變動與成功次數一致；贈點每帳號 1 次"
    priority: must
    context: [CTX-CON-014, CTX-EXT-005, CTX-EXT-001]
    source: "推導自點數制需求；plan §8.1"
    note: "屬推導，需確認"
  - id: NFR-016
    category: security
    status: deprecated
    reason: "user 更正為後端計算固定結果，前端計算結果不可信的前提不再成立"
    title: 前端計算結果不可信
    description: 前端計算並提交保存的測驗結果對後端而言屬不可信輸入；後端 MUST 驗證其格式與合法範圍，且用於 AI 報告與付費分析時 SHOULD 依原始作答重新計算或驗證結果。
    metric: "未量化，需與相關人確認（驗證/重算範圍）"
    priority: must
    context: [CTX-CON-003, CTX-ASM-008, CTX-EXT-005]
    source: "user 補充（結果前端 render）；全域 security 規則"
    note: "推導需求：計畫書原為後端計分，改前端後此風險新增，需確認"
  - id: NFR-015
    category: observability
    title: 指標與可追蹤性
    description: 系統 SHALL 保存模型名稱、提示詞版本、輸入資料版本供除錯與品質追蹤，並支援追蹤成功率、成本與轉換率。
    metric: "每份 AI 報告 100% 記錄上述三項欄位"
    priority: should
    context: [CTX-ACTOR-004, CTX-EXT-002]
    source: "plan §6.4, §12"
