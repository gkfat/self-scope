constraints:
  - id: CTX-CON-001
    category: business
    description: 星座、血型為娛樂性標籤；MBTI 為自我探索參考，不可當臨床診斷；結果須標示免責說明
    source: "plan §1.3, §10.1, §13.1"
  - id: CTX-CON-002
    category: business
    description: 未經標準化與驗證的智力測驗不得宣稱測得正式 IQ，不可由少量題目推算 IQ
    source: "plan §1.3, §6.2, §13.1"
  - id: CTX-CON-003
    category: technical
    description: 後端保管 AI API 金鑰、付款密鑰，前端不得持有；付費權限須由後端驗證
    source: "plan §6.4, §8.1"
  - id: CTX-CON-004
    category: technical
    description: 資料庫改用 Firebase（原計畫書建議 PostgreSQL，已被 user 指示取代）；§7 的關聯式資料表設計需改以 Firebase 資料模型表達，且唯一鍵等約束須以 Firebase 方式達成
    source: "plan §7；user 補充（對話）覆寫"
  - id: CTX-CON-005
    category: technical
    description: 768 種固定報告須資料驅動管理，不可硬編碼於程式，內容更新不需重新部署後端
    source: "plan §11 Phase 2, §13.4"
  - id: CTX-CON-006
    category: regulatory
    description: 資料最小化；須提供資料刪除、帳號刪除與隱私政策；日誌不得寫入不必要的敏感答案或完整報告；適用的個資/消費者保護法規依目標市場而定
    source: "plan §1.3, §3.1, §8.1, §13.3"
    note: "user 決定刪除帳號時移除全部使用者紀錄（CTX-CON-012），符合資料刪除要求；唯一保留的贈點紀錄（Google 帳號雜湊，3 個月）須於隱私政策載明並依目標市場確認"
  - id: CTX-CON-007
    category: business
    description: AI 成本須受控：固定摘要不呼叫 AI、報告生成後快取、設定 Token/次數/重試上限
    source: "plan §6.4, §9.4"
  - id: CTX-CON-008
    category: business
    description: 第一版範圍限定 Web App、星座/（選填）血型/MBTI、人類圖、固定結果與分享、Google 登入與紀錄、點數制（註冊贈點 + 購點）取得多維度分析報告與 AI 詳細分析；智力測驗、訂閱、歷史趨勢、AI 對話延後
    source: "plan §15；user 補充（點數制、人類圖）"
  - id: CTX-CON-010
    category: technical
    description: "前端技術棧為 Nuxt + Vue + Vuetify（Vite 建置），部署於 Vercel Pro 方案（Hobby 限個人非商業使用，須依官方條款確認）；首發為 Web App；函式執行時間受 Vercel 限制（Pro 上限 800 秒）"
    source: "user 補充（對話）"
  - id: CTX-CON-011
    category: business
    description: "不提供退款機制（user 已確認）；付款前須明確告知，並須使用者勾選「同意立即提供數位內容、放棄解約」且留存同意紀錄（是否足以排除解約權須法務確認）"
    source: "user 補充（對話）"
  - id: CTX-CON-012
    category: regulatory
    description: 會員的測驗作答與結果、多維度分析報告、MBTI、人類圖結果保存 3 個月；詳細分析保存 6 個月，到期前可用點數下載報告書；付款紀錄於帳號存續期間永久保存；使用者刪除帳號時移除全部紀錄（含付款），僅保留贈點紀錄 3 個月（user 已確認）。到期前通知使用者（通知系統後續實作）
    source: "user 補充（對話）"
    note: "贈點紀錄僅用於避免重複贈點，不作他用；含 Google 帳號識別（雜湊），隱私政策須載明"
  - id: CTX-CON-013
    category: technical
    description: Firestore 只由 Nuxt 伺服器端（Nitro + firebase-admin）存取，client 不直接讀寫；Firebase client SDK 僅用於 Google 登入取得 ID token，伺服器驗證 token；實作方式參考 gkbot-adventure-run 專案（Nuxt 4 SPA、Zod schema、api/services/repositories 分層、firestore.rules 全擋）
    source: "user 補充（對話）；參考專案 gkbot-adventure-run 的 CLAUDE.md、nuxt.config.ts、firestore.rules"
  - id: CTX-CON-014
    category: business
    description: "點數規則（user 已確認）：每帳號註冊僅贈送一次 3 點，同一 Google 帳號於贈點後 3 個月內刪帳號再註冊不再贈點；取得多維度分析報告 1 點；詳細分析 5 點；已生成過的詳細分析重新生成須扣點；每次下載詳細分析報告書扣 1 點（PDF 寄送 email，重複下載再扣點）；贈點有效期 90 天，購買的點數無限期；訪客不可取得多維度分析報告；定價規則：5 點售價 ≥ 單份 AI 報告成本約 3 倍加付款手續費，提供 3 個方案、大包有折扣，價格存於 pointPackages 可調整"
    source: "user 補充（對話）"
    note: "實際價格待上線前量測單份 AI 報告成本後決定"
  - id: CTX-CON-015
    category: regulatory
    description: MBTI 為註冊商標；對外名稱用「16 型人格」，題目自行撰寫，避免使用官方商標與測驗內容
    source: "user 採納建議"
    note: "商標與題庫授權須由法務確認"
  - id: CTX-CON-009
    category: business
    description: AI 報告的價值須建立在個人化與實際作答依據，且須區分「直接觀察」與「AI 推測」
    source: "plan §4, §6.2"

