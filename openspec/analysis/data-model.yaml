      - { name: "amount", type: "int", constraints: "required；正整數，方向由 type 決定" }
      - { name: "reason", type: "string", constraints: "required；WELCOME|SUMMARY|DETAILED_REPORT|REGENERATE|DOWNLOAD|PURCHASE" }
      - { name: "batchAllocations", type: "array<map>", constraints: "每筆 {batchId, amount}；扣點可跨批次" }
      - { name: "reference", type: "string", constraints: "nullable；summaryId／reportId／paymentId" }
      - { name: "createdAt", type: "timestamp", constraints: "required" }
    indexes:
      - { fields: ["createdAt DESC"], scope: "COLLECTION", purpose: "異動紀錄列表" }
    notes: "追加式、不可修改；以決定性文件 ID 的「建立若不存在」達成冪等，防重複扣點與重複入帳。"
