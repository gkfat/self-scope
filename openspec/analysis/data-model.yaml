      - { name: "granted", type: "int", constraints: "required" }
      - { name: "remaining", type: "int", constraints: "required；>= 0（RULE-007）" }
      - { name: "expiresAt", type: "timestamp", constraints: "nullable；購買批次為 null（無限期），贈點批次 = 建立後 90 天（RULE-008）" }
      - { name: "createdAt", type: "timestamp", constraints: "required" }
    indexes:
      - { fields: ["remaining ASC", "expiresAt ASC"], scope: "COLLECTION", purpose: "扣點時挑選未過期且有剩餘的批次（先到期先扣，無限期批次最後；已確認）" }
    notes: "扣點在 transaction 內讀取並更新批次，與 DATA-011 同交易寫入。"
  - id: DATA-011
    name: pointTransactions
    path: "users/{userId}/pointTransactions/{transactionId}"
    primaryKey: "由操作決定的 ID，例如 welcome、summary_{summaryId}、report_{reportId}、refund_{reportId}、purchase_{paymentId}"
    aggregate: AGG-008
    domainModel: ["ENT-010"]
    api: ["API-001", "API-014", "API-017", "API-020", "API-026", "API-022", "API-029"]
    columns:
      - { name: "transactionId", type: "string", constraints: "PK；決定性 ID 作為冪等鍵（RULE-007、RULE-025）" }
