version: 1
generatedBy: data-modeling
updatedAt: 2026-10-25T21:00:00+08:00
relatedChanges: [ai-personality-app]
store: firestore
storeNotes: "資料庫為 Firestore（CTX-CON-004）；僅由 Nuxt 伺服器端以 Admin SDK 存取，firestore.rules 全擋 client（CTX-CON-013）。以集合／子集合表達「表」，以決定性文件 ID 取代唯一約束。"

tables:
  - id: DATA-001
    name: users
    path: "users/{userId}"
    primaryKey: "userId（Firebase Auth uid）"
    aggregate: AGG-001
    domainModel: ["ENT-001", "VO-001", "VO-002", "VO-003"]
    api: ["API-001", "API-002", "API-003", "API-028", "API-029", "API-006"]
    columns:
      - { name: "userId", type: "string", constraints: "PK；= Firebase uid" }
      - { name: "email", type: "string", constraints: "required" }
      - { name: "birthData", type: "map", constraints: "BirthData 內嵌：birthDate, zodiac, birthTime?, birthPlace?（預設城市清單代碼）；birthDate 與 zodiac 必填（RULE-001）" }
      - { name: "bloodType", type: "string", constraints: "enum A|B|O|AB|UNKNOWN；預設 UNKNOWN" }
      - { name: "mbti", type: "string", constraints: "nullable；16 型之一" }
      - { name: "mbtiExpiresAt", type: "timestamp", constraints: "nullable；MBTI 設定後 3 個月到期，由排程清除 mbti" }
      - { name: "createdAt", type: "timestamp", constraints: "required" }
      - { name: "updatedAt", type: "timestamp", constraints: "required" }
    notes: "帳號的根文件，文件 ID 為 Firebase uid。刪除帳號時整份文件與全部子集合以 recursive delete 移除（RULE-024）；僅保留 DATA-018 贈點紀錄。"
  - id: DATA-002
    name: guestSessions
    path: "guestSessions/{sessionId}"
    primaryKey: "sessionId（不可猜測的隨機值）"
    aggregate: AGG-002
    domainModel: ["ENT-002", "VO-001", "VO-002", "VO-003"]
    api: ["API-004", "API-005", "API-011", "API-013", "API-006", "API-027"]
    ttl: { field: "expiresAt", duration: "1 day", rule: "RULE-016" }
    columns:
      - { name: "sessionId", type: "string", constraints: "PK" }
      - { name: "tempProfile", type: "map", constraints: "nullable；暫存的生日、星座、血型、MBTI" }
      - { name: "tempResults", type: "map", constraints: "nullable；暫存的測驗結果（MBTI 型別、testVersion、可含作答）與人類圖結果" }
      - { name: "createdAt", type: "timestamp", constraints: "required" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；= createdAt + 1 天；Firestore TTL 欄位" }
    notes: "不與任何 userId 關聯；claim 成功後立即刪除該文件。"
  - id: DATA-003
    name: tests
    path: "tests/{testId}"
    primaryKey: "testId"
    aggregate: AGG-003
    domainModel: ["ENT-003"]
    api: ["API-009", "API-010"]
    columns:
      - { name: "testId", type: "string", constraints: "PK" }
      - { name: "title", type: "string", constraints: "required" }
      - { name: "currentVersion", type: "string", constraints: "required；指向 versions 子集合" }
      - { name: "active", type: "boolean", constraints: "required" }
    notes: "測驗定義的根文件；與 DATA-004 同屬 AGG-003，發布新版本時一起更新。"
  - id: DATA-004
    name: testVersions
    path: "tests/{testId}/versions/{version}"
    primaryKey: "version"
    aggregate: AGG-003
    domainModel: ["ENT-003", "VO-007"]
    api: ["API-010", "API-011"]
    columns:
      - { name: "version", type: "string", constraints: "PK" }
      - { name: "questions", type: "array<map>", constraints: "Question 內嵌：questionId, text, options[]，及評分用 dimension（不外送）" }
      - { name: "scoringRule", type: "map", constraints: "評分規則（資料驅動，NFR-012）" }
      - { name: "publishedAt", type: "timestamp", constraints: "required" }
    notes: "版本不可變；送出作答以當時 testVersion 計分（RULE-027）。"
  - id: DATA-005
    name: testAttempts
    path: "users/{userId}/testAttempts/{attemptId}"
    primaryKey: "attemptId（自動產生）"
    aggregate: AGG-004
    domainModel: ["ENT-004", "VO-006", "VO-003"]
    api: ["API-011", "API-012", "API-006", "API-037", "API-028", "API-029"]
    columns:
      - { name: "attemptId", type: "string", constraints: "PK" }
      - { name: "testId", type: "string", constraints: "required；參照 DATA-003" }
      - { name: "testVersion", type: "string", constraints: "required；參照 DATA-004" }
      - { name: "answers", type: "array<map>", constraints: "Answer 內嵌：questionId, value, responseTimeMs?（僅在已告知時蒐集）" }
      - { name: "result", type: "string", constraints: "required；MBTI 16 型之一" }
      - { name: "completedAt", type: "timestamp", constraints: "required" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；= completedAt + 3 個月（RULE-014）" }
    indexes:
      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "排程清除到期資料（UC-017）" }
      - { fields: ["completedAt DESC"], scope: "COLLECTION", purpose: "個人中心列表" }
    notes: "訪客 claim 時將暫存結果寫入此集合；到期由 cron 清除（亦可加 Firestore TTL）。"
  - id: DATA-006
    name: fixedContents
    path: "fixedContents/{contentType}_{key}"
    primaryKey: "contentType 與 key 組成的決定性 ID，例如 SUMMARY_aries_INTJ_A、ZODIAC_aries"
    aggregate: AGG-005
    domainModel: ["ENT-005", "VO-004"]
    api: ["API-007", "API-008", "API-011", "API-014", "API-016", "API-031", "API-032", "API-033", "API-034", "API-027"]
    columns:
      - { name: "contentType", type: "string", constraints: "required；SUMMARY|ZODIAC|BLOOD|MBTI" }
      - { name: "key", type: "string", constraints: "required；summary 為組合鍵，單項為對應值" }
      - { name: "combinationKey", type: "map", constraints: "nullable；SUMMARY 才有：zodiac, mbti, bloodType?" }
      - { name: "body", type: "map", constraints: "title, summary, strengths[], blindSpots[], loveStyle, workStyle, communicationStyle, growthAdvice, disclaimer" }
      - { name: "contentVersion", type: "string", constraints: "required" }
      - { name: "status", type: "string", constraints: "required；DRAFT|REVIEWED|PUBLISHED" }
      - { name: "updatedAt", type: "timestamp", constraints: "required" }
      - { name: "publishedAt", type: "timestamp", constraints: "nullable" }
    indexes:
      - { fields: ["contentType ASC", "status ASC"], scope: "COLLECTION", purpose: "後台列表與覆蓋檢查（960 種 summary）" }
    notes: "以決定性文件 ID 保證組合唯一（RULE-021，取代 SQL UNIQUE）；僅 PUBLISHED 可供使用者讀取。含 192 + 768 = 960 筆 summary，另含星座、血型、MBTI 單項內容。"
  - id: DATA-007
    name: summaries
    path: "users/{userId}/summaries/{summaryId}"
    primaryKey: "由組合決定的 ID（如 aries_INTJ_A），同一會員同一組合僅一筆"
    aggregate: AGG-006
    domainModel: ["ENT-006", "VO-004"]
    api: ["API-014", "API-015", "API-016", "API-037", "API-028", "API-029"]
    columns:
      - { name: "summaryId", type: "string", constraints: "PK；= 組合鍵；以文件是否存在判斷是否已取得（RULE-005）" }
      - { name: "combinationKey", type: "map", constraints: "required；zodiac, mbti, bloodType?" }
      - { name: "contentRef", type: "string", constraints: "required；參照 DATA-006 文件 ID" }
      - { name: "contentVersion", type: "string", constraints: "required；取得時的內容版本" }
      - { name: "obtainedAt", type: "timestamp", constraints: "required；保存期限起算點" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；= obtainedAt + 3 個月" }
    indexes:
      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "排程清除到期資料（UC-017）" }
    notes: "建立此文件與扣點（DATA-010、DATA-011）須在同一個 Firestore transaction 內完成（AGG-006 與 AGG-008 的協調，NFR-017）。內容本體不複製，讀取時依 contentRef 取 DATA-006。"
  - id: DATA-008
    name: detailedReports
    path: "users/{userId}/detailedReports/{reportId}"
    primaryKey: "reportId（自動產生）"
    aggregate: AGG-007
    domainModel: ["ENT-007", "VO-004", "VO-008", "VO-009"]
    api: ["API-017", "API-018", "API-019", "API-020", "API-028", "API-029", "API-039"]
    columns:
      - { name: "reportId", type: "string", constraints: "PK" }
      - { name: "combinationKey", type: "map", constraints: "required；zodiac, mbti, bloodType?, humanDesignType?" }
      - { name: "input", type: "map", constraints: "AnalysisInput 內嵌：inputVersion, profile, results, answersDigest（僅保存生成所需的最小快照，NFR-005）" }
      - { name: "status", type: "string", constraints: "required；GENERATING|COMPLETED|FAILED" }
      - { name: "sections", type: "array<map>", constraints: "ReportSection 內嵌：title, content, evidence, evidenceKind(OBSERVED|INFERRED)" }
      - { name: "disclaimer", type: "string", constraints: "nullable" }
      - { name: "modelName", type: "string", constraints: "nullable；完成時寫入" }
      - { name: "promptVersion", type: "string", constraints: "nullable" }
      - { name: "supersedesReportId", type: "string", constraints: "nullable；重新生成時指向舊報告（舊報告保留）" }
      - { name: "failureReason", type: "string", constraints: "nullable" }
      - { name: "idempotencyKey", type: "string", constraints: "required；用於防止重複建立（RULE-025）" }
      - { name: "createdAt", type: "timestamp", constraints: "required" }
      - { name: "completedAt", type: "timestamp", constraints: "nullable" }
      - { name: "expiresAt", type: "timestamp", constraints: "nullable；完成時設為 completedAt + 6 個月（RULE-030）" }
      - { name: "downloadCount", type: "int", constraints: "required；預設 0；每次寄送報告書 +1" }
      - { name: "lastDownloadedAt", type: "timestamp", constraints: "nullable" }
    indexes:
      - { fields: ["createdAt DESC"], scope: "COLLECTION", purpose: "報告列表" }
      - { fields: ["idempotencyKey ASC"], scope: "COLLECTION", purpose: "以 Idempotency-Key 查既有請求" }
      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "排程清除到期報告（UC-017）" }
    notes: "保存 6 個月（RULE-030），到期前可用點數（每次 1 點）將報告書 PDF 寄送 email；每次寄送的扣點異動 ID 為 download_{reportId}_{序號}；每次重新生成新增一份。建立報告與扣 5 點在同一 transaction；失敗時返還點數並寫入 REFUND 異動。"
  - id: DATA-009
    name: pointAccount
