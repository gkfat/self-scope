openapi: "3.0.3"
info:
  title: "AI 多維度人格探索 App API"
  version: "0.1.0"
  description: "由 domain-model 與 use-cases 推導的 API 草案。Nuxt/Nitro server routes，Firestore 僅由伺服器端存取。"
servers:
  - url: "/api"
tags:
  - name: Auth
  - name: Profile
  - name: Guest
  - name: FixedResults
  - name: Tests
  - name: HumanDesign
  - name: Summaries
  - name: DetailedReports
  - name: ReportSnapshots
  - name: Points
  - name: Payments
  - name: Share
  - name: Account
  - name: Operations
  - name: Admin
  - name: Today
  - name: TransitReports
security:
  - bearerAuth: []
paths:
  "/auth/login":
    post:
      operationId: loginWithGoogle
      summary: "以 Google ID token 登入"
      description: "驗證 Firebase ID token；首次登入時建立帳號與點數帳戶，並一次性發放 3 點贈點（RULE-009）。已刪除帳號的 Google 帳號再次登入視為全新帳號（RULE-029）；若該 Google 帳號 3 個月內領過贈點則不再發放（RULE-031）。"
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "登入成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponse"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthorized"
      x-trace:
        id: API-001
        useCases: [UC-001, UC-002]
        domainModel: [ENT-001, ENT-016, AGG-001, AGG-008, AGG-013]
        businessRules: [RULE-009, RULE-029, RULE-031]
        requirements: [NFR-001, NFR-003]
  "/profile":
    get:
      operationId: getProfile
      summary: "取得我的個人資料"
      description: "回傳生日、星座、血型、MBTI 與選填的出生時間地點。"
      tags: [Profile]
      responses:
        "200":
          description: "個人資料"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        "401":
          "$ref": "#/components/responses/Unauthorized"
      x-trace:
        id: API-002
        useCases: [UC-003, UC-015]
        domainModel: [ENT-001, AGG-001]
        requirements: [NFR-003]
    put:
      operationId: updateProfile
      summary: "更新我的個人資料"
      description: "生日與星座必填（RULE-001）；血型、MBTI、出生時間與地點選填；血型可為 UNKNOWN。MBTI 於設定後 3 個月到期並被清除（RULE-014）。"
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: "更新後的個人資料"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthorized"
      x-trace:
        id: API-003
        useCases: [UC-003]
        domainModel: [ENT-001, AGG-001]
        businessRules: [RULE-001]
        requirements: [NFR-001, NFR-005]
  "/guest-sessions":
    post:
      operationId: createGuestSession
      summary: "建立訪客暫存 session"
      description: "為未登入訪客建立不可猜測的 session id；暫存資料 TTL 1 天，不與帳號關聯（RULE-016）。"
      tags: [Guest]
      security: []
      responses:
        "201":
          description: "已建立"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GuestSession"
        "429":
          "$ref": "#/components/responses/RateLimited"
      x-trace:
        id: API-004
        useCases: [UC-003, UC-005]
        domainModel: [ENT-002, AGG-002]
        businessRules: [RULE-016]
        requirements: [NFR-003, NFR-005]
  "/guest-sessions/{sessionId}/profile":
    put:
      operationId: saveGuestProfile
      summary: "暫存訪客個人資料"
      description: "僅供當次結果顯示；session 逾時後自動清除。"
      tags: [Guest]
      security: []
      parameters:
        - "$ref": "#/components/parameters/SessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: "已暫存"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileInput"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "404":
          "$ref": "#/components/responses/NotFound"
      x-trace:
        id: API-005
        useCases: [UC-003]
        domainModel: [ENT-002, AGG-002]
        businessRules: [RULE-001, RULE-016]
        requirements: [NFR-001]
  "/guest-sessions/{sessionId}/claim":
    post:
      operationId: claimGuestSession
      summary: "登入後將訪客暫存結果存入帳號"
      description: "以 session id 取出暫存結果並寫入目前登入帳號，完成後清除暫存。session 已過期時回傳 410。"
      tags: [Guest]
      parameters:
        - "$ref": "#/components/parameters/SessionIdPath"
        - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "已存入帳號"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ClaimResult"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "410":
          description: "暫存結果已過期"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-trace:
        id: API-006
        useCases: [UC-006]
        domainModel: [ENT-002, AGG-002, AGG-001, AGG-004]
        businessRules: [RULE-016, RULE-014]
        requirements: [NFR-003, NFR-017]
  "/fixed-results/zodiac":
    get:
      operationId: getZodiacResult
      summary: "取得星座單項結果"
      description: "依生日換算星座並回傳固定內容，不呼叫 AI、不扣點、不儲存（RULE-017、RULE-018）。"
      tags: [FixedResults]
      security: []
      parameters:
        - name: birthDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "星座固定結果"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FixedResultContent"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "404":
          "$ref": "#/components/responses/NotFound"
      x-trace:
        id: API-007
        useCases: [UC-004]
        domainModel: [ENT-005, AGG-005]
        businessRules: [RULE-017, RULE-018, RULE-023]
        requirements: [NFR-001, NFR-007, NFR-010]
  "/fixed-results/blood-types/{bloodType}":
    get:
      operationId: getBloodTypeResult
      summary: "取得血型單項分析"
      description: "UNKNOWN 不提供分析（RULE-002），回傳 404。"
      tags: [FixedResults]
      security: []
      parameters:
        - name: bloodType
          in: path
          required: true
          schema:
            "$ref": "#/components/schemas/BloodType"
      responses:
        "200":
          description: "血型固定結果"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FixedResultContent"
        "404":
          "$ref": "#/components/responses/NotFound"
      x-trace:
        id: API-008
        useCases: [UC-004]
        domainModel: [ENT-005, AGG-005]
        businessRules: [RULE-002, RULE-017, RULE-018, RULE-023]
        requirements: [NFR-007, NFR-010]
  "/tests":
    get:
      operationId: listTests
      summary: "取得可用測驗清單"
      description: ""
      tags: [Tests]
      security: []
      responses:
        "200":
          description: "測驗清單"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TestSummary"
      x-trace:
        id: API-009
        useCases: [UC-005]
        domainModel: [ENT-003, AGG-003]
        requirements: [NFR-012]
  "/tests/{testId}":
    get:
      operationId: getTest
      summary: "取得測驗題目"
      description: "回傳含版本的題目與選項，不含評分規則。"
      tags: [Tests]
      security: []
      parameters:
        - name: testId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "測驗內容"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Test"
        "404":
          "$ref": "#/components/responses/NotFound"
      x-trace:
        id: API-010
        useCases: [UC-005]
        domainModel: [ENT-003, AGG-003]
        businessRules: [RULE-027]
        requirements: [NFR-012]
  "/tests/{testId}/submissions":
    post:
      operationId: submitTest
      summary: "送出測驗作答並取得結果"
      description: "後端依評分規則計算結果並回傳固定內容；已登入者保存作答與結果（保存 3 個月，RULE-014），訪客需帶 X-Guest-Session-Id 暫存（TTL 1 天）。作答時間僅在使用者已告知時蒐集。"
      tags: [Tests]
      security:
        - bearerAuth: []
        - guestSession: []
        - {}
      parameters:
        - name: testId
          in: path
          required: true
          schema:
            type: string
        - "$ref": "#/components/parameters/GuestSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TestSubmissionRequest"
      responses:
        "200":
          description: "測驗結果"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TestSubmissionResponse"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "404":
          "$ref": "#/components/responses/NotFound"
      x-trace:
        id: API-011
        useCases: [UC-005]
        domainModel: [ENT-004, AGG-004, ENT-003, AGG-002]
        businessRules: [RULE-014, RULE-016, RULE-017, RULE-023, RULE-027]
        requirements: [NFR-001, NFR-006, NFR-007]
  "/test-attempts":
    get:
      operationId: listTestAttempts
      summary: "列出我的測驗結果"
      description: "僅回傳未到期的紀錄。"
      tags: [Tests]
      responses:
        "200":
          description: "測驗結果清單"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TestAttempt"
        "401":
          "$ref": "#/components/responses/Unauthorized"
      x-trace:
        id: API-012
        useCases: [UC-015]
        domainModel: [ENT-004, AGG-004]
        businessRules: [RULE-014]
        requirements: [NFR-003]
  "/human-design/calculations":
    post:
      operationId: calculateHumanDesign
      summary: "計算人類圖"
      description: "固定計算結果，不呼叫 AI；須同時提供生日、出生時間與出生地點（RULE-013）。已登入者的結果儲存於帳號（RULE-028），訪客需帶 X-Guest-Session-Id 暫存 1 天。以 POST 避免出生資料出現在 URL／日誌。"
      tags: [HumanDesign]
      security:
        - bearerAuth: []
        - guestSession: []
        - {}
      parameters:
        - "$ref": "#/components/parameters/GuestSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/HumanDesignRequest"
      responses:
        "200":
          description: "人類圖結果"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HumanDesignResult"
        "400":
          "$ref": "#/components/responses/ValidationError"
      x-trace:
        id: API-013
        useCases: [UC-008]
        domainModel: [ENT-014, AGG-012, VO-005, VO-001, ENT-002]
        businessRules: [RULE-013, RULE-017, RULE-023, RULE-028]
        requirements: [NFR-001, NFR-006, NFR-007]
  "/summaries":
    post:
      operationId: obtainSummary
      summary: "取得多維度分析報告"
      description: "依我的個人資料決定組合鍵（星座+MBTI，或加血型）。首次取得扣 1 點；已取得過的組合直接回傳不再扣點。需帶 Idempotency-Key 防止重複扣點。"
      tags: [Summaries]
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SummaryRequest"
      responses:
        "201":
          description: "首次取得（已扣 1 點）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SummaryObtained"
        "200":
          description: "已取得過，不重複扣點"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SummaryObtained"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "402":
          "$ref": "#/components/responses/InsufficientPoints"
        "422":
          description: "缺少 MBTI，無法取得 summary"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-trace:
        id: API-014
        useCases: [UC-007]
        domainModel: [ENT-006, AGG-006, AGG-008, ENT-005]
        businessRules: [RULE-002, RULE-003, RULE-004, RULE-005, RULE-007, RULE-017, RULE-023, RULE-025]
        requirements: [NFR-003, NFR-017]
    get:
      operationId: listSummaries
      summary: "列出我已取得的 summary"
      description: "僅回傳未到期的紀錄，不扣點。"
      tags: [Summaries]
      responses:
        "200":
          description: "summary 清單"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/MemberSummary"
        "401":
          "$ref": "#/components/responses/Unauthorized"
      x-trace:
        id: API-015
        useCases: [UC-015, UC-007]
        domainModel: [ENT-006, AGG-006]
        businessRules: [RULE-014]
        requirements: [NFR-003]
  "/summaries/{summaryId}":
    get:
      operationId: getSummary
      summary: "查看已取得的 summary"
      description: "讀取已保存內容，不扣點。"
      tags: [Summaries]
      parameters:
        - name: summaryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: summary
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemberSummary"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
      x-trace:
        id: API-016
        useCases: [UC-007, UC-015]
        domainModel: [ENT-006, AGG-006]
        businessRules: [RULE-005, RULE-014]
        requirements: [NFR-003]
  "/detailed-reports":
    post:
      operationId: createDetailedReport
      summary: "生成詳細分析"
      description: "至少需有星座與 MBTI 結果（RULE-033）；扣 5 點後非同步生成 AI 報告（逾時 120 秒視為失敗），回傳 202 與 reportId，以 GET 輪詢狀態（因函式執行時間上限）。失敗時返還點數。需 Idempotency-Key。"
      tags: [DetailedReports]
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DetailedReportRequest"
      responses:
        "202":
          description: "已受理，生成中"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReportAccepted"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "402":
          "$ref": "#/components/responses/InsufficientPoints"
        "422":
          description: "缺少 MBTI 結果，無法生成"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
      x-trace:
        id: API-017
        useCases: [UC-009]
        domainModel: [ENT-007, AGG-007, AGG-008, AGG-010]
        businessRules: [RULE-004, RULE-006, RULE-007, RULE-010, RULE-013, RULE-020, RULE-022, RULE-025, RULE-033]
        requirements: [NFR-003, NFR-008, NFR-009, NFR-011, NFR-013, NFR-017]
    get:
      operationId: listDetailedReports
      summary: "列出我的詳細分析"
      description: ""
      tags: [DetailedReports]
      responses:
        "200":
          description: "報告清單"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/DetailedReport"
        "401":
          "$ref": "#/components/responses/Unauthorized"
      x-trace:
        id: API-018
        useCases: [UC-015, UC-012]
        domainModel: [ENT-007, AGG-007]
        businessRules: [RULE-019]
        requirements: [NFR-003]
  "/detailed-reports/{reportId}":
    get:
      operationId: getDetailedReport
      summary: "查看詳細分析"
      description: "僅擁有者可存取；讀取已保存內容，不呼叫 AI、不扣點。生成中時回傳狀態。"
      tags: [DetailedReports]
      parameters:
        - "$ref": "#/components/parameters/ReportIdPath"
      responses:
        "200":
          description: "報告"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DetailedReport"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
      x-trace:
        id: API-019
        useCases: [UC-012, UC-009]
        domainModel: [ENT-007, AGG-007]
        businessRules: [RULE-019, RULE-023]
        requirements: [NFR-003, NFR-007]
  "/detailed-reports/{reportId}/regenerations":
    post:
      operationId: regenerateDetailedReport
      summary: "重新生成詳細分析"
      description: "扣 5 點並產生新報告，舊報告保留（RULE-006）。需 Idempotency-Key。"
      tags: [DetailedReports]
      parameters:
        - "$ref": "#/components/parameters/ReportIdPath"
        - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: "已受理，生成中（新報告）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReportAccepted"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "402":
          "$ref": "#/components/responses/InsufficientPoints"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "429":
          "$ref": "#/components/responses/RateLimited"
      x-trace:
        id: API-020
        useCases: [UC-013]
        domainModel: [ENT-007, AGG-007, AGG-008]
        businessRules: [RULE-006, RULE-007, RULE-010, RULE-019, RULE-022, RULE-025]
        requirements: [NFR-003, NFR-008, NFR-009, NFR-017]
  "/points":
    get:
      operationId: getPointBalance
      summary: "查看點數餘額與效期"
      description: "回傳未過期的可用餘額與各批次效期。"
      tags: [Points]
      responses:
        "200":
          description: "點數餘額"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PointBalance"
        "401":
          "$ref": "#/components/responses/Unauthorized"
      x-trace:
        id: API-021
        useCases: [UC-014]
        domainModel: [ENT-008, ENT-009, AGG-008]
        businessRules: [RULE-008]
        requirements: [NFR-003]
  "/points/transactions":
    get:
      operationId: listPointTransactions
      summary: "列出點數異動紀錄"
      description: ""
      tags: [Points]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "點數異動"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PointTransactionList"
        "401":
          "$ref": "#/components/responses/Unauthorized"
      x-trace:
        id: API-022
        useCases: [UC-014]
        domainModel: [ENT-010, AGG-008]
        requirements: [NFR-003]
  "/point-packages":
    get:
      operationId: listPointPackages
      summary: "取得可購買的點數方案"
      description: "價格後續決定。"
      tags: [Payments]
      security: []
      responses:
        "200":
          description: "點數方案"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/PointPackage"
      x-trace:
        id: API-023
        useCases: [UC-010]
        domainModel: [ENT-009, VO-010]
  "/payments":
    post:
      operationId: createPayment
