  "/points/transactions":
    get:
      operationId: listPointTransactions
      summary: "列出點數異動紀錄"
      description: ""
      tags: [Points]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "點數異動"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PointTransactionList"
        "401":
          "$ref": "#/components/responses/Unauthorized"
      x-trace:
        id: API-022
        useCases: [UC-014]
        domainModel: [ENT-010, AGG-008]
        requirements: [NFR-003]
  "/point-packages":
    get:
      operationId: listPointPackages
      summary: "取得可購買的點數方案"
      description: "價格後續決定。"
      tags: [Payments]
      security: []
      responses:
        "200":
          description: "點數方案"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/PointPackage"
      x-trace:
        id: API-023
        useCases: [UC-010]
        domainModel: [ENT-009, VO-010]
  "/payments":
    post:
      operationId: createPayment
      summary: "建立點數購買付款流程"
      description: "回傳付款頁連結與不退款告知（RULE-012）。"
      tags: [Payments]
      requestBody:
        required: true
        content:
