components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Firebase ID token"
      description: "Google 登入後取得的 Firebase ID token，後端驗證。Admin 路徑另需 editor／operator 角色 claim。"
    guestSession:
      type: apiKey
      in: header
      name: X-Guest-Session-Id
      description: "訪客暫存 session id（不可猜測，TTL 1 天）"
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: "付款服務簽章（實際標頭依供應商）"
    cronSecret:
      type: http
      scheme: bearer
      description: "Vercel Cron 帶入的 CRON_SECRET"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "防止重複扣點／重複生成（RULE-025、NFR-017）"
      schema:
        type: string
    GuestSessionId:
      name: X-Guest-Session-Id
      in: header
      required: false
      description: "未登入時用以暫存當次結果"
      schema:
        type: string
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    ReportIdPath:
      name: reportId
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationError:
      description: "請求格式或欄位無效，或違反業務規則（details 指出 RULE）"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "未登入或 token 無效"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "無權限（非擁有者或角色不足）"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: "資源不存在或已到期刪除"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InsufficientPoints:
      description: "點數不足或已過期"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    RateLimited:
      description: "超過頻率限制"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ConfirmationRequired:
      description: "需使用者確認（例如報告已下載過，重複下載將再扣 1 點），details 含上次下載時間"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      description: "統一錯誤格式；違反業務規則時 code 對應 RULE。"
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message]
    Zodiac:
      type: string
      enum: [aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn, aquarius, pisces]
    BloodType:
      type: string
      enum: [A, B, O, AB, UNKNOWN]
    MbtiType:
      type: string
      enum: [INTJ, INTP, ENTJ, ENTP, INFJ, INFP, ENFJ, ENFP, ISTJ, ISFJ, ESTJ, ESFJ, ISTP, ISFP, ESTP, ESFP]
    HumanDesignType:
      type: string
      enum: [generator, manifesting_generator, projector, manifestor, reflector]
    ContentType:
      type: string
      enum: [SUMMARY, ZODIAC, BLOOD, MBTI]
    ContentStatus:
      type: string
      enum: [DRAFT, REVIEWED, PUBLISHED]
    BirthData:
      type: object
      properties:
        birthDate:
          type: string
          format: date
        zodiac:
          "$ref": "#/components/schemas/Zodiac"
        birthTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          nullable: true
        birthPlace:
          type: string
          description: "預設城市清單的代碼（含經緯度與時區），由前端選單提供"
          nullable: true
      required: [birthDate, zodiac]
    ProfileInput:
      type: object
      properties:
        birthData:
          "$ref": "#/components/schemas/BirthData"
        bloodType:
          "$ref": "#/components/schemas/BloodType"
        mbti:
          "$ref": "#/components/schemas/MbtiType"
          nullable: true
      required: [birthData]
    Profile:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        birthData:
          "$ref": "#/components/schemas/BirthData"
        bloodType:
          "$ref": "#/components/schemas/BloodType"
        mbti:
          "$ref": "#/components/schemas/MbtiType"
          nullable: true
      required: [userId, birthData]
    LoginRequest:
      type: object
      properties:
        idToken:
          type: string
      required: [idToken]
    LoginResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        isNewUser:
          type: boolean
        welcomePointsGranted:
          type: integer
      required: [userId, isNewUser, welcomePointsGranted]
    GuestSession:
      type: object
      properties:
        sessionId:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [sessionId, expiresAt]
    ClaimResult:
      type: object
      properties:
        savedAttempts:
          type: integer
      required: [savedAttempts]
    FixedResultContent:
      type: object
      properties:
        contentType:
          "$ref": "#/components/schemas/ContentType"
        key:
          type: string
        title:
          type: string
        summary:
          type: string
        strengths:
          type: array
          items:
            type: string
        blindSpots:
          type: array
          items:
            type: string
        loveStyle:
          type: string
        workStyle:
          type: string
        communicationStyle:
          type: string
        growthAdvice:
          type: string
        disclaimer:
          type: string
        contentVersion:
          type: string
      required: [contentType, key, title, summary, disclaimer, contentVersion]
    FixedContentBody:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        strengths:
          type: array
          items:
            type: string
        blindSpots:
          type: array
          items:
            type: string
        loveStyle:
          type: string
        workStyle:
          type: string
        communicationStyle:
          type: string
        growthAdvice:
          type: string
        disclaimer:
          type: string
      required: [title, summary, disclaimer]
    FixedContentItem:
      type: object
      properties:
        contentType:
          "$ref": "#/components/schemas/ContentType"
        key:
          type: string
        body:
          "$ref": "#/components/schemas/FixedContentBody"
        contentVersion:
          type: string
        status:
          "$ref": "#/components/schemas/ContentStatus"
      required: [contentType, key, contentVersion, status]
    ContentCoverage:
      type: object
      properties:
        expectedSummaryCombinations:
          type: integer
          example: 960
        publishedSummaryCombinations:
