      - { step: 1, action: "使用者進入每日塔羅頁，系統查詢當日（台北日期）是否已翻牌", constraints: ["NFR-019"] }
      - { step: 2, action: "未翻牌時顯示牌背；使用者點擊翻牌" }
      - { step: 3, action: "後端以帳號與台北日期決定性地選出牌與正逆位，先確認內容可交付", constraints: ["NFR-018"] }
      - { step: 4, action: "後端以交易建立當日紀錄（不存在才建立），回傳牌與固定內容", constraints: ["NFR-018"] }
      - { step: 5, action: "系統顯示牌名、正逆位、關鍵字、今日訊息、建議與免責說明", constraints: ["NFR-020"] }
    alternateFlows:
      - { condition: "當日已翻過（含另一裝置、重複點擊）", handling: "不重新計算，直接回傳既有紀錄", constraints: ["NFR-018"] }
      - { condition: "並行請求", handling: "只建立一份紀錄，後到者讀到既有紀錄", constraints: ["NFR-018"] }
      - { condition: "未登入", handling: "拒絕並導回首頁" }
      - { condition: "內容尚未發佈", handling: "回 404 並顯示「今天的內容還在準備中」，MUST NOT 寫入紀錄" }
      - { condition: "頁面開著跨過台北午夜", handling: "重新查詢並回到牌背", constraints: ["NFR-019"] }
    postconditions:
      - "當日紀錄已建立，保存 3 個月；不扣點、不呼叫 AI"

