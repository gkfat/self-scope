useCases:
  - id: UC-001
    title: "以 Google 登入"
    actor: CTX-ACTOR-001
    requirements: ["FR-001", "FR-032"]
    stories: ["STORY-001"]
    preconditions:
      - "使用者未登入（含訪客）"
      - "Firebase Auth 已啟用 Google provider"
    mainFlow:
      - { step: 1, action: "使用者在 app 中選擇 Google 登入" }
      - { step: 2, action: "系統開啟 Google 登入視窗" }
      - { step: 3, action: "使用者完成 Google 授權" }
      - { step: 4, action: "前端取得 Firebase ID token 並送交後端", constraints: ["NFR-003"] }
      - { step: 5, action: "後端驗證 ID token 並辨識帳號", constraints: ["NFR-001", "NFR-003"] }
      - { step: 6, action: "系統回傳登入成功並導向原頁面" }
    alternateFlows:
      - { condition: "使用者關閉或取消登入視窗", handling: "保持訪客狀態並提示可再次登入" }
      - { condition: "ID token 無效或過期", handling: "後端回傳 401，前端重新取得 token 重試一次，仍失敗則提示重新登入" }
      - { condition: "Google 或 Firebase Auth 服務失敗", handling: "顯示明確錯誤，保持訪客狀態，不寫入任何資料" }
    postconditions:
      - "使用者已登入，後端可辨識其帳號"
      - "首次登入者另走 UC-002"
  - id: UC-002
    title: "首次登入建立帳號並領取贈點"
    actor: CTX-ACTOR-001
    requirements: ["FR-001", "FR-037"]
    stories: ["STORY-002"]
    preconditions:
      - "使用者首次以此 Google 帳號登入（後端查無對應帳號）"
    mainFlow:
      - { step: 1, action: "後端驗證 ID token 後確認帳號不存在" }
      - { step: 2, action: "系統建立使用者帳號與點數帳戶", constraints: ["NFR-017"] }
      - { step: 3, action: "系統檢查贈點紀錄（上次贈點未滿 3 個月者不發放），並一次性發放 3 點贈點、記錄贈點時間與異動", constraints: ["NFR-017"] }
      - { step: 4, action: "系統告知使用者已獲得 3 點" }
    alternateFlows:
      - { condition: "並行或重送的首次登入請求", handling: "贈點 MUST 僅發放一次，其餘請求回傳既有帳號" }
      - { condition: "建立帳號或點數帳戶失敗", handling: "整體回滾、不發放贈點，回傳明確錯誤，使用者可重試" }
      - { condition: "帳號已存在", handling: "略過贈點，視為一般登入" }
      - { condition: "此 Google 帳號先前曾刪除帳號", handling: "視為全新帳號：建立新的使用者與點數帳戶，不繼承任何歷史紀錄；若上次贈點未滿 3 個月則不再發放贈點（RULE-031）" }
    postconditions:
      - "帳號與點數帳戶存在，餘額 3 點，贈點僅一次"
    note: "贈點效期見 FR-042（長度待討論）"
  - id: UC-003
    title: "填寫生日、星座與選填資料"
    actor: CTX-ACTOR-001
    requirements: ["FR-002"]
    stories: ["STORY-003"]
    preconditions:
      - "使用者開啟個人資料或測驗入口"
    mainFlow:
      - { step: 1, action: "使用者輸入生日；系統帶入對應星座供確認", constraints: ["NFR-001"] }
      - { step: 2, action: "使用者可選填血型（A/B/O/AB/不知道）" }
      - { step: 3, action: "使用者可選填 MBTI、出生時間與出生地點（出生地點從預設城市清單選擇）" }
      - { step: 4, action: "系統驗證必填欄位（生日、星座）並在後端驗證格式", constraints: ["NFR-001"] }
      - { step: 5, action: "已登入者：系統儲存資料；訪客：以 session id 暫存於 Firestore，TTL 1 天，不與帳號關聯", constraints: ["NFR-005"] }
    alternateFlows:
      - { condition: "必填欄位缺漏或格式無效", handling: "標示錯誤並阻擋繼續" }
      - { condition: "血型選「不知道」", handling: "記錄為未知，後續分析不計入血型" }
      - { condition: "訪客", handling: "畫面明確提示未登入將不保留資料" }
    postconditions:
      - "個人資料可供單項結果、summary 與人類圖使用"
    note: "訪客資料不寫入 Firestore（FR-032）"
  - id: UC-004
    title: "取得單項免費結果（星座、血型）"
    actor: CTX-ACTOR-001
    requirements: ["FR-040", "FR-007", "FR-002"]
    stories: ["STORY-004"]
    preconditions:
      - "已提供生日／星座，血型分析另需已選血型"
    mainFlow:
      - { step: 1, action: "使用者選擇查看星座結果" }
      - { step: 2, action: "後端依生日／星座回傳固定結果內容", constraints: ["NFR-010", "NFR-007"] }
      - { step: 3, action: "使用者可選擇查看血型分析，後端回傳該血型固定內容" }
      - { step: 4, action: "系統顯示結果並附娛樂性免責說明", constraints: ["NFR-007"] }
    alternateFlows:
      - { condition: "血型為「不知道」或未填", handling: "不提供血型分析，提示可補填" }
      - { condition: "結果內容讀取失敗", handling: "回傳明確錯誤，不使用 AI 補足", constraints: ["NFR-011"] }
    postconditions:
      - "使用者看到固定單項結果；系統不扣點、不儲存此結果"
  - id: UC-005
    title: "完成 MBTI 測驗"
    actor: CTX-ACTOR-001
    requirements: ["FR-003", "FR-004", "FR-024", "FR-040", "FR-007"]
    stories: ["STORY-005"]
    preconditions:
      - "使用者開啟測驗清單"
    mainFlow:
      - { step: 1, action: "系統顯示可用測驗清單，使用者選擇 MBTI", constraints: ["NFR-012"] }
      - { step: 2, action: "後端回傳含版本的題目與選項" }
      - { step: 3, action: "使用者逐題作答；已告知時才記錄作答時間", constraints: ["NFR-005"] }
      - { step: 4, action: "使用者送出作答，後端驗證並依評分規則計算 16 型", constraints: ["NFR-001"] }
      - { step: 5, action: "系統顯示 MBTI 固定結果與免責說明", constraints: ["NFR-007"] }
      - { step: 6, action: "已登入者：系統保存此次測驗版本、作答與結果；訪客：以 session id 暫存於 Firestore，TTL 1 天", constraints: ["NFR-005"] }
    alternateFlows:
      - { condition: "作答不完整或選項無效", handling: "後端拒絕並指出缺漏題目" }
      - { condition: "測驗版本已更新", handling: "以送出時的版本評分，記錄所用版本" }
      - { condition: "訪客", handling: "結果頁提示未登入將不保留，並提供登入入口（UC-006）" }
      - { condition: "保存失敗", handling: "仍顯示結果，提示保存失敗並可重試" }
    postconditions:
      - "使用者取得 MBTI 結果；登入者的測驗結果保存 3 個月"
  - id: UC-006
    title: "訪客登入並保存當次結果"
    actor: CTX-ACTOR-001
    requirements: ["FR-032", "FR-005", "FR-001"]
    stories: ["STORY-006"]
    preconditions:
      - "訪客已完成測驗並看到結果"
      - "結果已以 session id 暫存於 Firestore（TTL 1 天）"
    mainFlow:
      - { step: 1, action: "結果頁提示未登入將不保留，使用者選擇登入保存" }
      - { step: 2, action: "使用者完成 UC-001 登入" }
      - { step: 3, action: "後端依 session id 取出暫存結果並寫入該帳號", constraints: ["NFR-001", "NFR-003"] }
      - { step: 4, action: "系統確認已保存並顯示於個人中心" }
    alternateFlows:
      - { condition: "使用者拒絕登入", handling: "不保存，暫存結果於 TTL 到期後自動清除" }
      - { condition: "暫存結果已過期（超過 1 天）或 session 不存在", handling: "提示結果已失效，引導重新測驗" }
      - { condition: "登入後寫入失敗", handling: "提示失敗並保留畫面結果供重試" }
      - { condition: "重送造成重複寫入", handling: "以當次結果冪等寫入，不產生重複紀錄" }
    postconditions:
      - "當次結果歸屬登入帳號，保存 3 個月；該 session 的暫存結果已清除"
    note: "暫存機制已定：session id + Firestore TTL 1 天（FR-032）"
  - id: UC-007
    title: "取得多維度分析報告"
    actor: CTX-ACTOR-001
    requirements: ["FR-006", "FR-007", "FR-038", "FR-041", "FR-014", "FR-042", "FR-032", "FR-040"]
    stories: ["STORY-007"]
    preconditions:
      - "使用者已登入"
      - "已提供星座與 MBTI（血型選填）"
    mainFlow:
      - { step: 1, action: "使用者選擇取得多維度分析報告" }
      - { step: 2, action: "後端驗證登入身分", constraints: ["NFR-003"] }
      - { step: 3, action: "後端依有無血型決定組合：星座+MBTI 或 星座+MBTI+血型（血型未知則用前者）" }
      - { step: 4, action: "後端檢查該會員是否已生成過此組合；若已生成則直接回傳已存 summary，不扣點", constraints: ["NFR-017"] }
      - { step: 5, action: "否則後端檢查未過期點數餘額 ≥ 1", constraints: ["NFR-017"] }
      - { step: 6, action: "後端原子地扣 1 點、記錄異動並保存該 summary 結果", constraints: ["NFR-017"] }
      - { step: 7, action: "系統顯示 summary 與免責說明", constraints: ["NFR-007", "NFR-010"] }
    alternateFlows:
      - { condition: "訪客", handling: "不可取得；提示登入（UC-001）" }
      - { condition: "缺少 MBTI", handling: "不提供 summary，引導完成 MBTI 或改看單項結果" }
      - { condition: "點數不足或已過期", handling: "拒絕並引導購買點數（UC-010）" }
      - { condition: "並行重複請求", handling: "僅扣一次點，其餘回傳已生成結果" }
      - { condition: "讀取組合內容失敗", handling: "不扣點，回傳明確錯誤", constraints: ["NFR-011"] }
    postconditions:
      - "會員取得該組多維度分析報告並保存 3 個月；已扣 1 點（首次）；重複取得不再扣點"
  - id: UC-008
    title: "計算並檢視人類圖"
    actor: CTX-ACTOR-001
    requirements: ["FR-036", "FR-002"]
    stories: ["STORY-008"]
    preconditions:
      - "已提供生日、出生時間與出生地點"
    mainFlow:
      - { step: 1, action: "使用者選擇查看人類圖" }
      - { step: 2, action: "後端驗證出生資料完整", constraints: ["NFR-001"] }
      - { step: 3, action: "後端依規則計算並回傳固定結果：類型、能量中心、人生角色、內在權威、策略、定義與通道、閘門；已登入者儲存於帳號，訪客暫存於其 session（TTL 1 天）" }
      - { step: 4, action: "系統顯示結果並附娛樂與自我探索免責說明", constraints: ["NFR-007"] }
    alternateFlows:
      - { condition: "未填出生時間或地點", handling: "不產生人類圖，提示補填" }
      - { condition: "出生地不在預設城市清單", handling: "請改選最接近的城市" }
      - { condition: "出生資料無效", handling: "標示錯誤並拒絕計算" }
      - { condition: "計算失敗", handling: "回傳明確錯誤，不使用 AI 補足", constraints: ["NFR-011"] }
    postconditions:
      - "使用者看到人類圖結果；已登入者的結果已儲存（保存 3 個月）；此結果為固定計算，不呼叫 AI"
    note: "單獨檢視不扣點；出生地點採預設城市清單（FR-036）"
  - id: UC-009
    title: "生成詳細分析"
    actor: CTX-ACTOR-002
    requirements: ["FR-015", "FR-016", "FR-017", "FR-018", "FR-019", "FR-022", "FR-014", "FR-038", "FR-036"]
    stories: ["STORY-009"]
    preconditions:
      - "使用者已登入"
      - "點數餘額 ≥ 5 且未過期"
      - "已有星座與 MBTI 結果（血型、人類圖選填）"
    mainFlow:
      - { step: 1, action: "使用者選擇生成詳細分析" }
      - { step: 2, action: "後端驗證登入、點數與用量限制", constraints: ["NFR-003", "NFR-008"] }
      - { step: 3, action: "後端將標籤、測驗結果與人類圖正規化為分析輸入並記錄資料版本" }
      - { step: 4, action: "後端原子扣 5 點並建立狀態為「生成中」的報告", constraints: ["NFR-017"] }
      - { step: 5, action: "後端呼叫 AI 供應商，設定 Token 與逾時上限", constraints: ["NFR-008", "NFR-009", "NFR-002"] }
      - { step: 6, action: "系統驗證報告含八章節、依據與不確定性標示，區分直接觀察與 AI 推測", constraints: ["NFR-013", "NFR-007"] }
      - { step: 7, action: "系統保存報告、模型名稱、提示詞版本與輸入版本，更新狀態為完成", constraints: ["NFR-015"] }
      - { step: 8, action: "系統記錄 AI 用量與預估成本" }
    alternateFlows:
      - { condition: "點數不足或已過期", handling: "拒絕並引導購買點數" }
      - { condition: "缺少 MBTI 結果", handling: "拒絕（422）並引導先完成 MBTI 測驗" }
      - { condition: "超過頻率或用量限制", handling: "拒絕並說明限制", constraints: ["NFR-008"] }
      - { condition: "AI 逾時或失敗", handling: "依重試策略重試；仍失敗則狀態為失敗、返還已扣點並回報明確錯誤", constraints: ["NFR-009", "NFR-011"] }
      - { condition: "輸出不符格式或含診斷式內容", handling: "視為失敗，不交付、不扣點", constraints: ["NFR-007", "NFR-013"] }
      - { condition: "並行重複請求", handling: "僅建立一份報告、僅扣一次點", constraints: ["NFR-017"] }
    postconditions:
      - "詳細分析保存 6 個月；點數已扣 5 點（失敗則返還）；用量已記錄"
    note: "非同步生成，逾時 120 秒視為失敗並返還點數（NFR-009）"
  - id: UC-010
