businessRules:
  - id: RULE-001
    description: "生日與星座為必填；血型、MBTI、出生時間與地點為選填"
    appliesTo: ["AGG-001"]
    useCases: ["UC-003"]
  - id: RULE-002
    description: "血型為未知時不計入組合鍵與分析"
    appliesTo: ["VO-004"]
    useCases: ["UC-004", "UC-007"]
  - id: RULE-003
    description: "多維度分析報告 的組合鍵只有「星座+MBTI」與「星座+MBTI+血型」兩種，缺 MBTI 不可取得；共 960 種"
    appliesTo: ["VO-004"]
    useCases: ["UC-007", "UC-019"]
  - id: RULE-004
    description: "訪客不可取得多維度分析報告 與詳細分析，使用點數前必須已登入"
    appliesTo: ["AGG-001"]
    useCases: ["UC-007", "UC-009"]
  - id: RULE-005
    description: "會員首次取得某組多維度分析報告 扣 1 點；同會員同組合已取得則不再扣點"
    appliesTo: ["AGG-006"]
    useCases: ["UC-007"]
  - id: RULE-006
    description: "生成詳細分析扣 5 點；已生成過的組合重新生成同樣扣 5 點；舊報告保留"
    appliesTo: ["AGG-007"]
    useCases: ["UC-009", "UC-013"]
  - id: RULE-007
    description: "點數僅能從未過期批次扣抵，順序為先到期先扣、無限期批次最後，餘額不得為負，扣抵須原子且冪等"
    appliesTo: ["AGG-008"]
    useCases: ["UC-007", "UC-009", "UC-013"]
  - id: RULE-008
    description: "購買的點數為無限期，贈點有效期 90 天；過期點數不可用"
    appliesTo: ["ENT-009"]
    useCases: ["UC-014"]
  - id: RULE-009
    description: "註冊贈點每帳號僅發放一次，共 3 點"
    appliesTo: ["AGG-008"]
    useCases: ["UC-002"]
  - id: RULE-010
    description: "詳細分析生成失敗時，已扣點數須返還"
    appliesTo: ["AGG-008"]
    useCases: ["UC-009", "UC-013"]
  - id: RULE-011
    description: "付款 webhook 須驗簽，並以事件 ID 冪等處理"
    appliesTo: ["AGG-009"]
    useCases: ["UC-011"]
  - id: RULE-012
    description: "付款後不提供退款；付款前須明確告知，並須使用者勾選同意立即提供數位內容、放棄解約，且記錄同意時間與條款版本"
    appliesTo: ["AGG-009"]
    useCases: ["UC-010"]
  - id: RULE-013
    description: "人類圖須同時有出生時間與出生地點才可計算"
    appliesTo: ["VO-005"]
    useCases: ["UC-008", "UC-009"]
  - id: RULE-014
    description: "會員的測驗結果、多維度分析報告、MBTI 欄位與人類圖結果保存 3 個月，以各筆產生時間起算"
    appliesTo: ["ENT-004"]
    useCases: ["UC-005", "UC-007", "UC-017"]
  - id: RULE-015
    description: "付款紀錄於帳號存續期間永久保存，刪除帳號時一併移除"
    appliesTo: ["ENT-007"]
    useCases: ["UC-009", "UC-016"]
  - id: RULE-016
    description: "訪客暫存以 session id 識別，TTL 1 天，不與帳號關聯"
    appliesTo: ["ENT-002"]
    useCases: ["UC-003", "UC-005", "UC-006"]
  - id: RULE-017
    description: "固定結果（單項、summary、人類圖）不呼叫 AI"
    appliesTo: ["AGG-005"]
    useCases: ["UC-004", "UC-007", "UC-008"]
  - id: RULE-018
    description: "單項免費結果不儲存，每次重新取得"
    appliesTo: ["AGG-005"]
    useCases: ["UC-004"]
  - id: RULE-019
    description: "報告僅擁有者可存取"
    appliesTo: ["AGG-007"]
    useCases: ["UC-012"]
  - id: RULE-020
    description: "AI 報告須含八章節與資料依據，區分直接觀察與 AI 推測，不得含診斷式內容"
    appliesTo: ["ENT-007"]
    useCases: ["UC-009"]
  - id: RULE-021
    description: "固定內容組合須唯一，經審核才可發布"
    appliesTo: ["AGG-005"]
    useCases: ["UC-019"]
  - id: RULE-022
    description: "AI 生成須受 Token、頻率、額度與逾時限制"
    appliesTo: ["AGG-007"]
    useCases: ["UC-009", "UC-013", "UC-020"]
  - id: RULE-023
    description: "所有結果與報告須附娛樂／自我探索性質的免責說明"
    appliesTo: ["ENT-005"]
    useCases: ["UC-004", "UC-005", "UC-007", "UC-008", "UC-012"]
  - id: RULE-024
    description: "刪除帳號時移除該使用者的全部紀錄（個人資料、測驗結果、summary、詳細分析、人類圖、點數、付款），僅保留贈點紀錄；AI 用量紀錄保留但清除 userId"
    appliesTo: ["AGG-001"]
    useCases: ["UC-016"]
  - id: RULE-025
    description: "同一組合的並行生成或扣點請求只處理一次"
    appliesTo: ["AGG-007"]
    useCases: ["UC-009", "UC-013"]
  - id: RULE-026
    description: "分享卡不得包含不必要的個人資料"
    appliesTo: ["VO-011"]
    useCases: ["UC-018"]
  - id: RULE-027
    description: "測驗以送出當下的版本評分，並記錄所用版本"
    appliesTo: ["ENT-004"]
    useCases: ["UC-005"]
  - id: RULE-028
    description: "已登入會員計算出的人類圖結果須儲存；訪客僅暫存於 session（TTL 1 天）"
    appliesTo: ["AGG-012"]
    useCases: ["UC-008"]
  - id: RULE-029
    description: "同一 Google 帳號於刪除後再次登入視為全新帳號，不繼承任何歷史紀錄"
    appliesTo: ["AGG-001"]
    useCases: ["UC-001", "UC-002", "UC-016"]
  - id: RULE-030
    description: "詳細分析保存 6 個月，以生成完成時間起算；到期前可使用點數下載報告書"
    appliesTo: ["ENT-007"]
    useCases: ["UC-009", "UC-017", "UC-021"]
  - id: RULE-031
    description: "同一 Google 帳號於上次領取贈點後 3 個月內刪除帳號再註冊，不再發放贈點；贈點紀錄 3 個月後到期，且僅用於避免重複贈點、不作他用"
    appliesTo: ["AGG-013"]
    useCases: ["UC-002"]
  - id: RULE-033
    description: "生成詳細分析至少需有星座與 MBTI 結果；血型與人類圖為選填"
    appliesTo: ["AGG-007"]
    useCases: ["UC-009"]
  - id: RULE-034
    description: "每日指標只存計數，不含任何個人資料"
    appliesTo: ["ENT-017"]
    useCases: ["UC-020"]
  - id: RULE-032
    description: "下載詳細分析報告書每次扣 1 點，以 PDF 寄送至使用者 email；僅限報告擁有者且報告未到期；已下載過者須提醒並經確認才可重複下載"
    appliesTo: ["AGG-007"]
    useCases: ["UC-021"]
  - id: RULE-035
    description: "每日抽取：同一帳號、同一台北日期、同一類抽取（塔羅、盧恩）只有一筆紀錄；結果由帳號與日期決定性地決定；已存在時直接回傳既有紀錄，不重新計算"
    appliesTo: ["AGG-015"]
    useCases: ["UC-023", "UC-024"]
  - id: RULE-036
    description: "每日抽取與今日 Kin 免費、不呼叫 AI；固定內容尚未發佈時不得寫入任何紀錄"
    appliesTo: ["AGG-015", "AGG-016"]
    useCases: ["UC-023", "UC-024", "UC-025"]
  - id: RULE-037
    description: "盧恩逆位只適用於 15 枚方向可辨識的符文；Gebo、Hagalaz、Nauthiz、Isa、Jera、Eihwaz、Sowilo、Ingwaz、Dagaz 共 9 枚上下旋轉後外觀不變，只有正位；不含空白符文"
    appliesTo: ["AGG-015"]
    useCases: ["UC-024"]
  - id: RULE-038
    description: "「今日」以 Asia/Taipei（UTC+8）換日，由伺服器計算，不接受客戶端傳入的日期；頁面跨過午夜後須重新查詢"
    appliesTo: ["AGG-015", "AGG-016", "AGG-017"]
    useCases: ["UC-022", "UC-023", "UC-024", "UC-025", "UC-027"]
  - id: RULE-039
    description: "今日 Kin：每會員每台北日期可計算一次，計算即解鎖查看且不扣點；解鎖後當日查看次數不限；同日重複計算回傳既有結果"
    appliesTo: ["AGG-016"]
    useCases: ["UC-025"]
  - id: RULE-040
    description: "瑪雅 Kin 採 Dreamspell 曆法；2/29 不計入，生日或查詢日為 2/29 時沿用 2/28 的 Kin；今日 Kin 與生日 Kin 使用同一套演算法"
    appliesTo: ["AGG-016", "ENT-001"]
    useCases: ["UC-025", "UC-026"]
  - id: RULE-041
    description: "今日 Kin 與生日 Kin 的固定內容分開撰寫，各 260 筆，不共用"
    appliesTo: ["AGG-005"]
    useCases: ["UC-025", "UC-026"]
  - id: RULE-042
    description: "行運盤固定以台北當日 00:00（UTC+8）計算，同一台北日期的行運盤唯一；報告與頁面須標明以此時刻為準"
    appliesTo: ["AGG-017"]
    useCases: ["UC-027"]
  - id: RULE-043
    description: "本命盤與行運盤皆納入日、月、水、金、火、木、土、天王、海王、冥王十顆天體（本命盤另含上升）；既有七顆與上升的結果不因擴充而改變"
