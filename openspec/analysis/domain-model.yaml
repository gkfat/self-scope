    note: "只含事實資料，不含使用者自由文字（NFR-001 精神）"
  - id: VO-017
    name: KinResult
    nameZh: "瑪雅 Kin 結果"
    useCases: ["UC-025", "UC-026"]
    attributes:
      - { name: kinNumber, type: "int", description: "1 至 260" }
      - { name: solarSeal, type: "int", description: "20 圖騰之一" }
      - { name: galacticTone, type: "int", description: "13 調性之一" }
    note: "由日期以 Dreamspell 曆法決定；2/29 沿用 2/28"
  - id: VO-018
    name: DrawnSymbol
    nameZh: "抽到的牌或符文"
    useCases: ["UC-023", "UC-024"]
    attributes:
      - { name: symbolIndex, type: "int", description: "塔羅 0 至 21、盧恩 0 至 23" }
      - { name: orientation, type: "enum", description: "UPRIGHT｜REVERSED；9 枚對稱盧恩只有 UPRIGHT" }

aggregates:
  - id: AGG-001
    name: UserAccount
    root: ENT-001
    members: ["VO-001", "VO-002", "VO-003"]
    useCases: ["UC-001", "UC-002", "UC-003", "UC-015", "UC-016"]
    rationale: "帳號與個人資料需一致更新，且刪除帳號時整體處理"
  - id: AGG-002
    name: GuestSession
    root: ENT-002
    members: ["VO-001", "VO-002", "VO-003"]
    useCases: ["UC-003", "UC-005", "UC-006"]
    rationale: "訪客暫存資料以 session 為界，TTL 到期整體清除，登入時整體轉入帳號"
  - id: AGG-003
    name: TestDefinition
    root: ENT-003
    members: ["VO-007"]
    useCases: ["UC-005"]
    rationale: "測驗版本、題目與評分規則須一起版本化"
  - id: AGG-004
