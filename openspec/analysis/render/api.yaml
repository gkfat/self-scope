      parameters:
        - name: contentType
          in: query
          schema:
            "$ref": "#/components/schemas/ContentType"
        - name: status
          in: query
          schema:
            "$ref": "#/components/schemas/ContentStatus"
      responses:
        "200":
          description: "固定內容"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/FixedContentItem"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/admin/fixed-contents/{contentType}/{key}":
    put:
      operationId: saveFixedContent
      summary: "新增或修改固定內容（草稿）"
      description: "【MVP 後】組合須唯一且合法（RULE-003、RULE-021），更新時遞增 contentVersion。需 editor 角色。"
      tags: [Admin]
      parameters:
        - name: contentType
          in: path
          required: true
          schema:
            "$ref": "#/components/schemas/ContentType"
        - name: key
          in: path
          required: true
          description: "summary 為組合鍵（如 aries_INTJ_A），單項為對應值"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FixedContentBody"
      responses:
        "200":
          description: "已儲存"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FixedContentItem"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/admin/fixed-contents/{contentType}/{key}/publication":
    post:
      operationId: publishFixedContent
      summary: "審核後發布固定內容"
      description: "【MVP 後】發布後即生效，無需重新部署。需 editor 角色。"
      tags: [Admin]
      parameters:
        - name: contentType
          in: path
          required: true
          schema:
            "$ref": "#/components/schemas/ContentType"
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "已發布"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FixedContentItem"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/admin/fixed-contents/coverage":
    get:
      operationId: getFixedContentCoverage
      summary: "檢查 summary 組合覆蓋"
      description: "【MVP 後】列出 960 種組合中尚未發布者。需 editor 角色。"
      tags: [Admin]
      responses:
        "200":
          description: "覆蓋狀況"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContentCoverage"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/admin/ai-usage":
    get:
      operationId: getAiUsage
      summary: "查看 AI 用量與成本"
      description: "【MVP 後】需 operator 角色。"
      tags: [Admin]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "用量統計"
