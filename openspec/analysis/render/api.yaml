              schema:
                "$ref": "#/components/schemas/AiUsageSummary"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/admin/metrics":
    get:
      operationId: getProductMetrics
      summary: "查看產品指標"
      description: "【MVP 後】讀取伺服器端每日計數：測驗完成、summary 取得、報告成功與失敗、付款完成、分享卡產生。需 operator 角色。"
      tags: [Admin]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "指標"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductMetrics"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/cron/data-expiry":
    get:
      operationId: runDataExpiry
      summary: "排程清除到期資料"
      description: "由 Vercel Cron 呼叫，以 CRON_SECRET 驗證；刪除滿 3 個月的測驗結果、多維度分析報告、MBTI 欄位與人類圖結果，以及滿 6 個月的詳細分析，不影響付款紀錄。"
      tags: [Operations]
      security:
        - cronSecret: []
      responses:
        "200":
          description: "清除結果"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CronResult"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/human-design":
    get:
      operationId: getHumanDesign
      summary: "取得我已儲存的人類圖"
      description: "讀取已儲存的人類圖結果，不重新計算。尚未計算過回傳 404。"
      tags: [HumanDesign]
      responses:
        "200":
          description: "人類圖結果"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HumanDesignResult"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/detailed-reports/{reportId}/downloads":
    post:
      operationId: downloadDetailedReport
      summary: "以點數取得詳細分析報告書（寄送 email）"
      description: "僅報告擁有者且報告未到期；每次扣 1 點，產生 PDF 並寄送至使用者 email。若該報告已下載過，未帶 confirmRepeat=true 時回傳 409 提醒（不扣點），確認後才重複扣點。需 Idempotency-Key。"
      tags: [DetailedReports]
      parameters:
        - "$ref": "#/components/parameters/ReportIdPath"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReportDownloadRequest"
      responses:
        "202":
          description: "已受理並寄送"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReportDelivery"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "402":
          "$ref": "#/components/responses/InsufficientPoints"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/ConfirmationRequired"
  "/today":
    get:
      operationId: getTodayStatus
      summary: "「此刻／今日」區塊的當日狀態"
      description: "回傳台北今日各項的狀態（塔羅已抽否、盧恩已抽否、今日 Kin 已解鎖否、今日即時星象報告是否存在及其狀態），供首頁區塊顯示；只回傳狀態與簡短識別，不含固定內容全文。日期由伺服器以 Asia/Taipei 計算，不接受客戶端日期（RULE-038）。訪客不可使用（RULE-050），前端未登入時只顯示登入提示、不呼叫此端點。"
      tags: [Today]
      responses:
        "200":
          description: "當日狀態"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TodayStatus"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/tarot/daily":
    get:
      operationId: getDailyTarot
      summary: "查詢今日塔羅"
      description: "回傳今日是否已翻牌；已翻則含牌、正逆位與固定內容。不寫入紀錄。以帳號與台北日期決定（RULE-035、RULE-038）。"
      tags: [Today]
      responses:
        "200":
          description: "今日塔羅狀態"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DailyTarotState"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    post:
      operationId: drawDailyTarot
      summary: "翻今日塔羅"
      description: "同帳號同台北日期只建立一筆紀錄；已翻過則回傳既有結果、不重新計算，可安全重試與並行（RULE-035、NFR-018）。免費、不呼叫 AI（RULE-036）。固定內容尚未發佈時回 404，且不寫入紀錄。結果須附免責說明（RULE-049）。"
      tags: [Today]
      responses:
        "200":
          description: "今日塔羅（新翻開或既有）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DailyTarotState"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/rune/daily":
    get:
      operationId: getDailyRune
      summary: "查詢今日盧恩"
      description: "回傳今日是否已抽符；已抽則含符文、正逆位與固定內容。不寫入紀錄。"
      tags: [Today]
      responses:
        "200":
          description: "今日盧恩狀態"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DailyDrawState"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    post:
      operationId: drawDailyRune
      summary: "抽今日盧恩"
      description: "Elder Futhark 24 枚；僅 15 枚方向可辨識的符文可為逆位，Gebo、Hagalaz、Nauthiz、Isa、Jera、Eihwaz、Sowilo、Ingwaz、Dagaz 只有正位（RULE-037）。同帳號同日只有一筆，已抽過回傳既有結果（RULE-035）。免費、不呼叫 AI。內容尚未發佈回 404 且不寫入紀錄。"
      tags: [Today]
      responses:
        "200":
          description: "今日盧恩（新抽出或既有）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DailyDrawState"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/kin/today":
    get:
      operationId: getTodayKin
      summary: "查詢今日瑪雅 Kin"
      description: "回傳今日是否已解鎖；已解鎖則含 Kin 與固定內容，解鎖後當日可不限次數查看（RULE-039）。未解鎖時不回傳 Kin 內容。"
      tags: [Today]
      responses:
        "200":
          description: "今日 Kin 狀態"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KinTodayState"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    post:
      operationId: unlockTodayKin
      summary: "計算並解鎖今日 Kin"
      description: "每會員每台北日期可計算一次，計算即解鎖、不扣點（RULE-039）；已解鎖則回傳既有結果。Kin 以 Dreamspell 曆法計算，2/29 沿用 2/28（RULE-040）。內容為今日 Kin 專用的 260 筆（RULE-041），尚未發佈回 404 且不寫入紀錄。"
      tags: [Today]
      responses:
        "200":
          description: "已解鎖的今日 Kin（新解鎖或既有）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KinTodayState"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/fixed-results/maya-kin":
    get:
      operationId: getBirthKinResult
      summary: "取得生日瑪雅 Kin"
      description: "依生日以 Dreamspell 曆法計算 Kin，回傳生日 Kin 專用的固定內容（260 筆，與今日 Kin 內容分開，RULE-041）。2/29 沿用 2/28（RULE-040）。不呼叫 AI、不扣點、不儲存。是否須登入、訪客可否取得比照單項免費結果，屬推導待確認（FR-048）。"
      tags: [FixedResults]
      security: []
      parameters:
        - name: birthDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "生日 Kin 結果"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BirthKinResult"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/transit-reports":
    post:
      operationId: createTransitReport
      summary: "生成即時星象報告"
      description: "以會員已存的出生日期、時間與城市計算本命盤，與台北當日 00:00（UTC+8）的行運盤（十顆天體）及相位，扣點後非同步生成 AI 報告，回傳 202 與 reportId，以 GET 輪詢（RULE-042、RULE-043）。同帳號同台北日期同本命資料版本已有報告時回 200 並回傳既有報告，不再扣點（RULE-045）；本命資料變更視為新的一份。缺少出生日期、時間或城市回 422 且不扣點（RULE-044）。失敗、逾時或品質檢查不通過時返還點數（RULE-046）。需 Idempotency-Key。價格待定（CTX-CON-017）。"
      tags: [TransitReports]
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "今日已有報告，回傳既有結果，不扣點"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransitReportAccepted"
        "202":
          description: "已受理，生成中"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransitReportAccepted"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "402":
          "$ref": "#/components/responses/InsufficientPoints"
        "422":
          description: "缺少出生日期、時間或城市，無法生成"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
    get:
      operationId: listTransitReports
      summary: "列出我的即時星象報告"
      description: "僅回傳自己的、未到期的報告（RULE-047、RULE-048）。"
      tags: [TransitReports]
      responses:
        "200":
          description: "報告清單"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TransitReport"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/transit-reports/{reportId}":
    get:
      operationId: getTransitReport
      summary: "查看即時星象報告"
      description: "僅擁有者可存取；讀取已保存內容，不呼叫 AI、不扣點（RULE-048）。生成中回傳狀態；已滿 3 個月到期刪除者回 404。"
      tags: [TransitReports]
      parameters:
        - "$ref": "#/components/parameters/ReportIdPath"
      responses:
        "200":
          description: "報告"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransitReport"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/transit-reports/{reportId}/export":
    post:
      operationId: exportTransitReportPdf
      summary: "匯出即時星象報告 PDF"
      description: "【尚未實作】讀取已保存內容產生 PDF，不呼叫 AI（RULE-048）；僅擁有者、報告未到期。是否扣點、下載或寄送 email、是否與詳細分析報告書（API-035 以後）共用機制尚未決定（CTX-ASM-019），確認後再補 request 與 response 細節。"
      tags: [TransitReports]
      parameters:
        - "$ref": "#/components/parameters/ReportIdPath"
      responses:
        "200":
          description: "PDF 檔"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Firebase ID token"
      description: "Google 登入後取得的 Firebase ID token，後端驗證。Admin 路徑另需 editor／operator 角色 claim。"
    guestSession:
      type: apiKey
      in: header
      name: X-Guest-Session-Id
      description: "訪客暫存 session id（不可猜測，TTL 1 天）"
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: "付款服務簽章（實際標頭依供應商）"
    cronSecret:
      type: http
      scheme: bearer
      description: "Vercel Cron 帶入的 CRON_SECRET"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "防止重複扣點／重複生成（RULE-025、NFR-017）"
      schema:
        type: string
    GuestSessionId:
      name: X-Guest-Session-Id
      in: header
      required: false
      description: "未登入時用以暫存當次結果"
      schema:
        type: string
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    ReportIdPath:
      name: reportId
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationError:
      description: "請求格式或欄位無效，或違反業務規則（details 指出 RULE）"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "未登入或 token 無效"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "無權限（非擁有者或角色不足）"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: "資源不存在或已到期刪除"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InsufficientPoints:
      description: "點數不足或已過期"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    RateLimited:
      description: "超過頻率限制"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ConfirmationRequired:
      description: "需使用者確認（例如報告已下載過，重複下載將再扣 1 點），details 含上次下載時間"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      description: "統一錯誤格式；違反業務規則時 code 對應 RULE。"
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message]
    Zodiac:
      type: string
      enum: [aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn, aquarius, pisces]
    BloodType:
      type: string
      enum: [A, B, O, AB, UNKNOWN]
    Gender:
      type: string
      description: "選填；只用來決定八字大運的排法（男命、女命順逆不同），不用於其他分析或顯示"
      enum: [MALE, FEMALE]
    MbtiType:
      type: string
      enum: [INTJ, INTP, ENTJ, ENTP, INFJ, INFP, ENFJ, ENFP, ISTJ, ISFJ, ESTJ, ESFJ, ISTP, ISFP, ESTP, ESFP]
    HumanDesignType:
      type: string
      enum: [generator, manifesting_generator, projector, manifestor, reflector]
    ContentType:
      type: string
      enum: [SUMMARY, ZODIAC, BLOOD, MBTI, NUMEROLOGY]
    ContentStatus:
      type: string
      enum: [DRAFT, REVIEWED, PUBLISHED]
    BirthData:
      type: object
      properties:
        birthDate:
          type: string
          format: date
        zodiac:
          "$ref": "#/components/schemas/Zodiac"
        birthTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          nullable: true
        birthPlace:
          type: string
          description: "預設城市清單的代碼（含經緯度與時區），由前端選單提供"
          nullable: true
      required: [birthDate, zodiac]
    ProfileInput:
      type: object
      properties:
        birthData:
          "$ref": "#/components/schemas/BirthData"
        bloodType:
          "$ref": "#/components/schemas/BloodType"
        mbti:
          "$ref": "#/components/schemas/MbtiType"
          nullable: true
        gender:
          "$ref": "#/components/schemas/Gender"
          nullable: true
      required: [birthData]
    Profile:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        birthData:
          "$ref": "#/components/schemas/BirthData"
        bloodType:
          "$ref": "#/components/schemas/BloodType"
        mbti:
          "$ref": "#/components/schemas/MbtiType"
          nullable: true
        gender:
          "$ref": "#/components/schemas/Gender"
          nullable: true
      required: [userId, birthData]
    LoginRequest:
      type: object
      properties:
        idToken:
          type: string
      required: [idToken]
    LoginResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        isNewUser:
          type: boolean
        welcomePointsGranted:
          type: integer
      required: [userId, isNewUser, welcomePointsGranted]
    GuestSession:
      type: object
      properties:
        sessionId:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [sessionId, expiresAt]
    ClaimResult:
      type: object
      properties:
        savedAttempts:
          type: integer
      required: [savedAttempts]
    FixedResultContent:
      type: object
      properties:
        contentType:
          "$ref": "#/components/schemas/ContentType"
        key:
          type: string
        title:
          type: string
        summary:
          type: string
        strengths:
          type: array
          items:
            type: string
        blindSpots:
          type: array
          items:
            type: string
        loveStyle:
          type: string
        workStyle:
          type: string
        communicationStyle:
          type: string
        growthAdvice:
          type: string
        disclaimer:
          type: string
        contentVersion:
          type: string
      required: [contentType, key, title, summary, disclaimer, contentVersion]
    FixedContentBody:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        strengths:
          type: array
          items:
            type: string
        blindSpots:
          type: array
          items:
            type: string
        loveStyle:
          type: string
        workStyle:
          type: string
        communicationStyle:
          type: string
        growthAdvice:
          type: string
        disclaimer:
          type: string
      required: [title, summary, disclaimer]
    FixedContentItem:
      type: object
      properties:
        contentType:
          "$ref": "#/components/schemas/ContentType"
        key:
          type: string
        body:
          "$ref": "#/components/schemas/FixedContentBody"
        contentVersion:
          type: string
        status:
          "$ref": "#/components/schemas/ContentStatus"
      required: [contentType, key, contentVersion, status]
    ContentCoverage:
      type: object
      properties:
        expectedSummaryCombinations:
          type: integer
          example: 960
        publishedSummaryCombinations:
          type: integer
        missing:
          type: array
          items:
            "$ref": "#/components/schemas/CombinationKey"
      required: [expectedSummaryCombinations, publishedSummaryCombinations, missing]
    TestSummary:
      type: object
      properties:
        testId:
          type: string
        title:
          type: string
        version:
          type: string
        questionCount:
          type: integer
      required: [testId, title, version]
    Question:
      type: object
      properties:
        questionId:
          type: string
        text:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
            required: [value, label]
      required: [questionId, text, options]
    Test:
      type: object
      properties:
        testId:
          type: string
        title:
          type: string
        version:
          type: string
        questions:
          type: array
          items:
            "$ref": "#/components/schemas/Question"
      required: [testId, version, questions]
    Answer:
      type: object
      properties:
        questionId:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
        responseTimeMs:
          type: integer
          minimum: 0
          nullable: true
      required: [questionId, value]
    TestSubmissionRequest:
      type: object
      properties:
        testVersion:
          type: string
        answers:
          type: array
          items:
            "$ref": "#/components/schemas/Answer"
          minItems: 1
        responseTimeConsent:
          type: boolean
          description: "使用者已被告知並同意蒐集作答時間"
      required: [testVersion, answers]
    TestSubmissionResponse:
      type: object
      properties:
        attemptId:
          type: string
          nullable: true
        testVersion:
          type: string
        result:
          "$ref": "#/components/schemas/MbtiType"
        content:
          "$ref": "#/components/schemas/FixedResultContent"
        persisted:
          type: boolean
          description: "訪客為 false（僅暫存 1 天）"
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required: [testVersion, result, content, persisted]
    TestAttempt:
      type: object
      properties:
        attemptId:
          type: string
        testId:
          type: string
        testVersion:
          type: string
        result:
          "$ref": "#/components/schemas/MbtiType"
        completedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [attemptId, testId, testVersion, result, completedAt, expiresAt]
    CombinationKey:
      type: object
      description: "多維度分析用到的維度；沒選的維度為 null"
      properties:
        zodiac:
          "$ref": "#/components/schemas/Zodiac"
          nullable: true
        mbti:
          "$ref": "#/components/schemas/MbtiType"
          nullable: true
        bloodType:
          "$ref": "#/components/schemas/BloodType"
          nullable: true
        humanDesignType:
          "$ref": "#/components/schemas/HumanDesignType"
          nullable: true
        numerology:
          type: string
          nullable: true
          description: "生命靈數（1–9、11、22、33）；未選入此組合時為 null"
      required: [zodiac, mbti]
    SummaryRequest:
      type: object
      properties:
        dimensions:
          type: array
          minItems: 2
          uniqueItems: true
          description: "固定內容分析：星座、血型、MBTI、生命靈數擇 2～4 個（含人類圖的組合走 /detailed-reports）。2 個維度 1 點、3 個維度 3 點、4 個維度 5 點。"
          items:
            type: string
            enum: [ZODIAC, BLOOD, MBTI, NUMEROLOGY]
      required: [dimensions]
    MemberSummary:
      type: object
      properties:
        summaryId:
          type: string
        combinationKey:
          "$ref": "#/components/schemas/CombinationKey"
        content:
          "$ref": "#/components/schemas/FixedResultContent"
        obtainedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [summaryId, combinationKey, content, obtainedAt, expiresAt]
    SummaryObtained:
      allOf:
        - "$ref": "#/components/schemas/MemberSummary"
        - type: object
          properties:
            pointsDeducted:
              type: integer
              description: "首次取得為 1，已取得過為 0"
          required: [pointsDeducted]
    GuestProfile:
      type: object
      properties:
        birthData:
          type: object
          nullable: true
          additionalProperties: true
        bloodType:
          type: string
          enum: [A, B, O, AB, UNKNOWN]
        mbti:
          type: string
          nullable: true
        gender:
          "$ref": "#/components/schemas/Gender"
          nullable: true
        hasHumanDesign:
          type: boolean
      required: [birthData, bloodType, mbti, gender, hasHumanDesign]
    NatalChartRequest:
      type: object
      properties:
        birthDate:
          type: string
          format: date
        birthTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        birthPlace:
          type: string
          description: "預設城市清單的代碼"
      required: [birthDate, birthTime, birthPlace]
    NatalChartPlacement:
      type: object
      properties:
        sign:
          type: string
          enum: [aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn, aquarius, pisces]
        degree:
          type: integer
          minimum: 0
          maximum: 29
      required: [sign, degree]
    NatalChart:
      type: object
      properties:
        ascendant:
          "$ref": "#/components/schemas/NatalChartPlacement"
        bodies:
          type: object
          properties:
            SUN:
              "$ref": "#/components/schemas/NatalChartPlacement"
            MOON:
              "$ref": "#/components/schemas/NatalChartPlacement"
            MERCURY:
              "$ref": "#/components/schemas/NatalChartPlacement"
            VENUS:
              "$ref": "#/components/schemas/NatalChartPlacement"
            MARS:
              "$ref": "#/components/schemas/NatalChartPlacement"
            JUPITER:
              "$ref": "#/components/schemas/NatalChartPlacement"
            SATURN:
              "$ref": "#/components/schemas/NatalChartPlacement"
            URANUS:
              "$ref": "#/components/schemas/NatalChartPlacement"
            NEPTUNE:
              "$ref": "#/components/schemas/NatalChartPlacement"
            PLUTO:
              "$ref": "#/components/schemas/NatalChartPlacement"
        timeNote:
          type: string
          nullable: true
          enum: [AMBIGUOUS, NONEXISTENT]
      required: [ascendant, bodies, timeNote]
    BaziRequest:
      type: object
      properties:
        birthDate:
          type: string
          format: date
          description: "真實且不在未來的日期"
        birthTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          nullable: true
          description: "出生地的當地時間；沒有時只算三柱"
        birthPlace:
          type: string
          nullable: true
          description: "預設城市清單的代碼；沒有時以 Asia/Taipei 計算"
        gender:
          "$ref": "#/components/schemas/Gender"
          nullable: true
          description: "只用來決定大運的排法；沒有時不輸出大運與流年"
      required: [birthDate]
    BaziPillar:
      type: object
      properties:
        stem:
          type: string
          description: "天干"
        branch:
          type: string
          description: "地支"
      required: [stem, branch]
    BaziFlowYear:
      type: object
      properties:
        year:
          type: integer
        pillar:
          "$ref": "#/components/schemas/BaziPillar"
        tenGod:
          type: string
          description: "對日干的十神"
      required: [year, pillar, tenGod]
    BaziChart:
      type: object
      properties:
        timeZone:
          type: string
        timeZoneAssumed:
          type: boolean
          description: "沒有提供出生城市而以預設時區計算"
        hasTime:
          type: boolean
        baziYear:
          type: integer
          description: "年柱所屬的年（立春之前為前一年）"
        pillars:
          type: object
          properties:
            year:
              "$ref": "#/components/schemas/BaziPillar"
            month:
              "$ref": "#/components/schemas/BaziPillar"
            day:
              "$ref": "#/components/schemas/BaziPillar"
            hour:
              "$ref": "#/components/schemas/BaziPillar"
              nullable: true
          required: [year, month, day, hour]
        dayMaster:
          type: object
          properties:
            stem:
              type: string
            element:
              type: string
              enum: [wood, fire, earth, metal, water]
            polarity:
              type: string
              enum: [YANG, YIN]
          required: [stem, element, polarity]
        chart:
          type: array
          description: "每柱的十神、五行與藏干（含藏干的十神）"
          items:
            type: object
            additionalProperties: true
        elementCounts:
          type: object
          description: "八個字（三柱為六個）的五行數量，不加權"
          additionalProperties:
            type: integer
        tenGodCounts:
          type: object
          additionalProperties:
            type: integer
        groupCounts:
          type: object
          description: "比劫 peer、食傷 output、財 wealth、官殺 power、印 resource"
          additionalProperties:
            type: integer
        facts:
          type: object
          description: "地勢與自坐、空亡、納音、命宮與胎元、生肖、節氣與季節、合沖關係；只列事實，不附吉凶"
          additionalProperties: true
        strength:
          type: object
          description: "幫扶分、強弱分級、五行旺衰、命格與喜用神（以十神類別表示；中和時 useful 為 null）"
          additionalProperties: true
        bone:
          type: object
          nullable: true
          description: "稱骨骨重；沒有出生時間時為 null"
          additionalProperties: true
        lateZi:
          type: boolean
        borderline:
          type: array
          description: "距離節或時辰界線 30 分鐘內的交界提示"
          items:
            type: object
            additionalProperties: true
        termDay:
          type: object
          nullable: true
          description: "沒有時間且出生日剛好有節時，月柱（或年柱）可能不同"
          additionalProperties: true
        luckStatus:
          type: string
          enum: [OK, NEEDS_GENDER, NEEDS_TIME]
        luck:
          type: object
          nullable: true
          description: "大運：順逆、起運歲數、8 步大運（含起訖歲數與年份、十神）、目前的大運與各步的十個流年"
          additionalProperties: true
        flowYears:
          type: array
          nullable: true
          description: "今年（立春換年）與接下來 4 年；沒有性別時為 null"
          items:
            "$ref": "#/components/schemas/BaziFlowYear"
        interpretation:
          type: object
          description: "事先寫好的固定內容（日主、五行、十神群組、月令、強弱、命格、喜用神、稱骨、目前的大運）"
          additionalProperties: true
      required: [timeZone, timeZoneAssumed, hasTime, baziYear, pillars, dayMaster, chart, elementCounts, tenGodCounts, groupCounts, facts, strength, bone, lateZi, borderline, termDay, luckStatus, luck, flowYears, interpretation]
    HumanDesignRequest:
      type: object
      properties:
        birthDate:
          type: string
          format: date
        birthTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        birthPlace:
          type: string
          description: "預設城市清單的代碼"
      description: "三個欄位皆選填：未提供的部分取自已儲存的個人資料（會員）或訪客 session 的個人資料；補齊後仍缺出生時間或地點回傳 422（BIRTH_TIME_REQUIRED／BIRTH_PLACE_REQUIRED）。"
    HumanDesignResult:
      type: object
      properties:
        type:
          "$ref": "#/components/schemas/HumanDesignType"
        strategy:
          type: string
          enum: [INFORM, RESPOND, WAIT_FOR_INVITATION, WAIT_A_LUNAR_CYCLE]
        authority:
          type: string
          enum: [EMOTIONAL, SACRAL, SPLENIC, EGO, SELF_PROJECTED, MENTAL, LUNAR]
        profile:
          type: string
          example: "1/3"
        definition:
          type: string
          enum: [NONE, SINGLE, SPLIT, TRIPLE_SPLIT, QUADRUPLE_SPLIT]
        incarnationCross:
          type: object
          properties:
            angle:
              type: string
              enum: [RIGHT_ANGLE, JUXTAPOSITION, LEFT_ANGLE]
            gates:
              type: array
              description: "人格太陽/地球、設計太陽/地球四個閘門"
              items:
                type: integer
          required: [angle, gates]
        definedCenters:
          type: array
          items:
            type: string
            enum: [HEAD, AJNA, THROAT, G, HEART, SACRAL, SPLEEN, SOLAR_PLEXUS, ROOT]
        channels:
          type: array
          items:
            type: array
            items:
              type: integer
        personality:
          type: array
          description: "出生時的 13 個天體閘門與線（意識）"
          items:
            "$ref": "#/components/schemas/HumanDesignActivation"
        design:
          type: array
          description: "出生前太陽弧 88 度的 13 個天體閘門與線（潛意識）"
          items:
            "$ref": "#/components/schemas/HumanDesignActivation"
        disclaimer:
          type: string
        saved:
          type: boolean
          description: "會員為 true（保存 3 個月）；訪客為 true 表示暫存於 session"
        expiresAt:
          type: integer
          nullable: true
      required: [type, strategy, authority, profile, definition, incarnationCross, disclaimer, saved]
    HumanDesignActivation:
      type: object
      properties:
        body:
          type: string
        gate:
          type: integer
          minimum: 1
          maximum: 64
        line:
          type: integer
          minimum: 1
          maximum: 6
      required: [body, gate, line]
    DetailedReportRequest:
      type: object
      properties:
        dimensions:
          type: array
          minItems: 2
          uniqueItems: true
          description: "含人類圖的組合（由 AI 產生）：至少 2 個維度且必須包含 HUMAN_DESIGN；2 個維度 3 點、3 個維度 5 點、4 個維度 8 點、5 個維度 13 點。各維度需已完成。"
          items:
            type: string
            enum: [ZODIAC, BLOOD, MBTI, HUMAN_DESIGN, NUMEROLOGY]
      required: [dimensions]
    ReportSection:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        evidence:
          type: string
        evidenceKind:
          type: string
          enum: [OBSERVED, INFERRED]
      required: [title, content, evidenceKind]
    DetailedReport:
      type: object
      properties:
        reportId:
          type: string
        status:
          type: string
          enum: [GENERATING, COMPLETED, FAILED]
        combinationKey:
          "$ref": "#/components/schemas/CombinationKey"
        sections:
          type: array
          items:
            "$ref": "#/components/schemas/ReportSection"
        disclaimer:
          type: string
        modelName:
          type: string
        promptVersion:
          type: string
        supersedesReportId:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [reportId, status, combinationKey, createdAt]
    ReportDelivery:
      type: object
      properties:
        pointsDeducted:
          type: integer
        deliveredTo:
          type: string
          description: "遮罩後的 email"
        requestedAt:
          type: string
          format: date-time
        downloadCount:
          type: integer
      required: [pointsDeducted, deliveredTo, requestedAt]
    ReportDownloadRequest:
      type: object
      properties:
        confirmRepeat:
          type: boolean
          default: false
          description: "已下載過時須為 true 才會重複扣點與寄送"
    ReportAccepted:
      type: object
      properties:
        reportId:
          type: string
        status:
          type: string
          enum: [GENERATING]
        pointsDeducted:
          type: integer
      required: [reportId, status, pointsDeducted]
    PointBatch:
      type: object
      properties:
        batchId:
          type: string
        source:
          type: string
          enum: [WELCOME, PURCHASE]
        granted:
          type: integer
        remaining:
          type: integer
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required: [batchId, source, remaining]
    PointBalance:
      type: object
      properties:
        availableBalance:
          type: integer
        batches:
          type: array
          items:
            "$ref": "#/components/schemas/PointBatch"
      required: [availableBalance, batches]
    PointTransaction:
      type: object
      properties:
        transactionId:
          type: string
        type:
          type: string
          enum: [GRANT, PURCHASE, DEDUCT, REFUND]
        amount:
          type: integer
        reason:
          type: string
          enum: [WELCOME, SUMMARY, DETAILED_REPORT, REGENERATE, DOWNLOAD, PURCHASE]
        reference:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [transactionId, type, amount, reason, createdAt]
    PointTransactionList:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/PointTransaction"
        nextCursor:
          type: string
          nullable: true
      required: [items]
    Money:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
      required: [amount, currency]
    PointPackage:
      type: object
      properties:
        packageId:
          type: string
        points:
          type: integer
        price:
          "$ref": "#/components/schemas/Money"
        validityDays:
          type: integer
          description: "null 代表無限期"
          nullable: true
      required: [packageId, points, price]
    CreatePaymentRequest:
      type: object
      properties:
        packageId:
          type: string
        acceptDigitalContentTerms:
          type: boolean
          description: "必須為 true：同意立即提供數位內容並放棄解約（RULE-012）"
        termsVersion:
          type: string
      required: [packageId, acceptDigitalContentTerms, termsVersion]
    CheckoutSession:
      type: object
      properties:
        paymentId:
          type: string
        checkoutUrl:
          type: string
          format: uri
        noRefundNotice:
          type: string
      required: [paymentId, checkoutUrl, noRefundNotice]
    Payment:
      type: object
      properties:
        paymentId:
          type: string
        pointsPurchased:
          type: integer
        amount:
          "$ref": "#/components/schemas/Money"
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]
        createdAt:
          type: string
          format: date-time
      required: [paymentId, pointsPurchased, amount, status, createdAt]
    WebhookAck:
      type: object
      properties:
        received:
          type: boolean
      required: [received]
    ShareCardRequest:
      type: object
      properties:
        source:
          type: string
          enum: [SINGLE_RESULT, SUMMARY, HUMAN_DESIGN]
        referenceId:
          type: string
      required: [source, referenceId]
    ShareCard:
      type: object
      properties:
        title:
          type: string
        summaryText:
          type: string
        imageUrl:
          type: string
          format: uri
          nullable: true
      required: [title, summaryText]
    DeleteDataRequest:
      type: object
      properties:
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [RESULTS, SUMMARIES, REPORTS, HUMAN_DESIGN]
      required: [scopes]
    DeleteResult:
      type: object
      properties:
        deleted:
          type: array
          items:
            type: string
      required: [deleted]
    AiUsageSummary:
      type: object
      properties:
        totalCalls:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        estimatedCost:
          type: number
        averageCostPerReport:
          type: number
      required: [totalCalls, estimatedCost]
    ProductMetrics:
      type: object
      properties:
        testsStarted:
          type: integer
        testsCompleted:
          type: integer
        shares:
          type: integer
        paymentConversionRate:
          type: number
        reportSuccessRate:
          type: number
    CronResult:
      type: object
      properties:
        deletedAttempts:
          type: integer
        deletedSummaries:
          type: integer
      required: [deletedAttempts, deletedSummaries]
    TodayStatus:
      type: object
      properties:
        date:
          type: string
          format: date
          description: "台北日期，由伺服器計算"
        tarot:
          type: object
          properties:
            drawn:
              type: boolean
          required: [drawn]
        rune:
          type: object
          properties:
            drawn:
              type: boolean
          required: [drawn]
        kin:
          type: object
          properties:
            unlocked:
              type: boolean
          required: [unlocked]
        transitReport:
          type: object
          properties:
            exists:
              type: boolean
            reportId:
              type: string
              nullable: true
            status:
              type: string
              nullable: true
              enum: [GENERATING, COMPLETED, FAILED]
          required: [exists]
      required: [date, tarot, rune, kin, transitReport]
    DrawnSymbol:
      type: object
      properties:
        symbolIndex:
          type: integer
          description: "塔羅 0 至 21；盧恩 0 至 23"
        orientation:
          type: string
          enum: [UPRIGHT, REVERSED]
          description: "9 枚對稱盧恩只有 UPRIGHT（RULE-037）"
      required: [symbolIndex, orientation]
    DailyDrawState:
      type: object
      properties:
        date:
          type: string
          format: date
        drawn:
          type: boolean
        symbol:
          "$ref": "#/components/schemas/DrawnSymbol"
        content:
          "$ref": "#/components/schemas/FixedResultContent"
      required: [date, drawn]
    TarotCard:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 21
        roman:
          type: string
        name:
          type: string
        englishName:
          type: string
        orientation:
          type: string
          enum: [upright, reversed]
        illustration:
          type: string
          nullable: true
          description: "插畫來源；尚無插畫時為 null"
      required: [index, roman, name, englishName, orientation, illustration]
    DailyTarotState:
      type: object
      properties:
        date:
          type: string
          format: date
        drawn:
          type: boolean
        card:
          "$ref": "#/components/schemas/TarotCard"
        content:
          "$ref": "#/components/schemas/FixedResultContent"
      required: [date, drawn]
      description: "drawn 為 false 時只有 date；為 true 時含 card 與 content"
    KinResult:
      type: object
      properties:
        kinNumber:
          type: integer
          minimum: 1
          maximum: 260
        solarSeal:
          type: integer
          minimum: 1
          maximum: 20
        galacticTone:
          type: integer
          minimum: 1
          maximum: 13
      required: [kinNumber, solarSeal, galacticTone]
    KinTodayState:
      type: object
      properties:
        date:
          type: string
          format: date
        unlocked:
          type: boolean
        kin:
          "$ref": "#/components/schemas/KinResult"
        content:
          "$ref": "#/components/schemas/FixedResultContent"
      required: [date, unlocked]
    BirthKinResult:
      type: object
      properties:
        kin:
          "$ref": "#/components/schemas/KinResult"
        content:
          "$ref": "#/components/schemas/FixedResultContent"
      required: [kin, content]
    TransitReportAccepted:
      type: object
      properties:
        reportId:
          type: string
        status:
          type: string
          enum: [GENERATING, COMPLETED, FAILED]
        transitDate:
          type: string
          format: date
        pointsDeducted:
          type: integer
          description: "既有報告時為 0"
      required: [reportId, status, transitDate, pointsDeducted]
    TransitReport:
      type: object
      properties:
        reportId:
          type: string
        status:
          type: string
          enum: [GENERATING, COMPLETED, FAILED]
        transitDate:
          type: string
          format: date
        transitAt:
          type: string
          format: date-time
          description: "行運盤計算時刻，固定為台北當日 00:00（RULE-042）"
        sections:
          type: array
          items:
            "$ref": "#/components/schemas/ReportSection"
          description: "章節結構待定"
        disclaimer:
          type: string
        modelName:
          type: string
        promptVersion:
          type: string
        failureReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required: [reportId, status, transitDate, transitAt, createdAt]
